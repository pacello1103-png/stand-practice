    tools: ['Lector de partituras', 'Anotaciones con Pencil', 'Plan de estudio', 'Metrónomo', 'Afinador', 'Bordón', 'Grabadora y vídeo', 'Registro de estudio', 'Notación', 'Cuadernos'],
    faq: [['¿En qué dispositivos funciona Stand?', 'iPad y iPhone con iPadOS o iOS 15 o posterior. El iPad es el atril; el iPhone lleva tu estudio, las partituras para leer y las herramientas en el bolsillo, y puede grabar para el iPad. Pasar páginas guiñando el ojo usa la cámara frontal y funciona mejor en un iPad con Face ID.'],
      ['¿Necesito una cuenta o internet?', 'Nunca hay cuenta. Stand funciona sin conexión. Internet solo se usa cuando pides algo en línea, como buscar una partitura en IMSLP o abrir una grabación en YouTube, Spotify o Apple Music.'],
      ['¿Dónde se guardan mis partituras?', 'En tu dispositivo, en Stand y en una carpeta Stand de la app Archivos (Partituras, Grabaciones, Copias). Haz una copia de todo en un solo archivo cuando quieras, por ejemplo en iCloud Drive, y recupérala en un iPad nuevo.'],
      ['¿Puedo usar mi pedal para pasar páginas?', 'Sí. Los pedales Bluetooth funcionan directamente. También puedes guiñar el ojo, tocar el borde de la página, golpear el atril, dejar que el metrónomo pase cada pocos compases o dejar que Stand siga lo que tocas.'],
      ['¿Mis anotaciones cambian el PDF?', 'Nunca. Las anotaciones están en su propia capa. Ocúltalas con un toque, o exporta la partitura con ellas o como copia limpia.'],
      ['¿Sirve para mi instrumento?', 'Stand está hecho para todos los músicos que leen música: cuerdas, maderas, metales, teclados, guitarra, voz. El afinador, el bordón, los armónicos y las escalas se sienten especialmente en casa con los instrumentos de cuerda, y el compositor conoce más de 100 instrumentos.']],
  },

  /* ---------------- Français ---------------- */
  fr: {
    f: { read: ['Lire', 'Vos partitions sur le pupitre, deux pages à la fois, tournées sans lever la main.'],
      mark: ['Annoter', 'Écrivez sur la musique avec l’Apple Pencil, comme avec un crayon sur le papier.'],
      practise: ['Travailler', 'Savoir quoi travailler, à quel tempo, et combien vous avez vraiment travaillé.'],
      listen: ['Accorder & Enregistrer', 'Entendez exactement où vous en êtes : justesse, tempo et vidéo.', 'Accorder'],
      write: ['Écrire', 'Composez, arrangez et copiez de la musique, et tenez des cahiers.'] },
    c: {
      library: ['Bibliothèque', 'Toutes vos partitions au même endroit.', 'Importez des PDF et des photos, ou numérisez des pages avec l’appareil photo. Comme une app de numérisation, Stand trouve la page, la redresse grâce aux lignes de la portée et enlève les ombres, pour qu’une photo ressemble à une copie propre. Le titre et le compositeur sont lus pour vous.', ['Importer depuis Fichiers', 'Numériser avec l’appareil photo', 'Dossiers', 'Un dossier Stand dans l’app Fichiers']],
      find: ['Trouver une partition', 'Des partitions du domaine public en quelques secondes.', 'Cherchez dans la bibliothèque IMSLP par compositeur et par œuvre. Stand signale la meilleure édition pour votre instrument, et elle arrive dans votre bibliothèque, prête à lire et à annoter. Pour les éditions qui valent la peine d’être achetées, des liens mènent vers Henle, Bärenreiter et d’autres éditeurs.', ['Tapez « Bach suite violoncelle »', 'Choisissez votre instrument', 'Touchez un résultat']],
      turns: ['Tourner les pages', 'Six façons de tourner la page.', 'Deux pages côte à côte à l’horizontale, une à la verticale, ou une page à l’italienne couchée sur un écran vertical. Tournez-les comme cela vous arrange sur le moment.', [['Toucher ou glisser', 'Sur les bords de la page'], ['Pédale', 'N’importe quelle pédale Bluetooth'], ['Clin d’œil', 'L’œil droit avance, le gauche recule'], ['Écoute', 'Suit votre jeu, et vos yeux (bêta)'], ['Toc', 'Un coup franc sur le pupitre'], ['Métronome', 'Toutes les 2 à 16 mesures']]],
      thisscore: ['Cette partition', 'Chaque partition réglée à votre façon.', 'La demi-page montre le haut de la page suivante pendant que vous finissez celle-ci : vous n’attendez jamais une tourne.', [['Demi-page', 'Voir la suite'], ['Reprises et sauts', 'D.C., reprises, codas'], ['Signets', 'Aller à un mouvement'], ['Papier', 'Blanc, chaud ou nuit'], ['Musique plus grande', 'Sans marges blanches'], ['Exporter en PDF', 'Avec ou sans annotations']]],
      pages: ['Pages', 'Corrigez l’édition, ne vous contentez pas de la lire.', 'Recadrez une page sur la musique utile, coupez-la entre deux systèmes ou remontez des lignes pour que la tourne tombe mieux. Ajoutez des pages depuis un fichier, remettez une page à l’endroit et retirez des pages : rien n’est perdu tant que vous ne le décidez pas.', ['Recadrer', 'Couper entre les systèmes', 'Remonter des lignes', 'Ajouter des pages', 'Tourner une page', 'Tout remettre']],
      sets: ['Programmes', 'Tout un concert dans un seul ordre de lecture.', 'Choisissez des pages de plusieurs partitions pour une audition, un examen ou un concert. Après la dernière page d’une œuvre, la partition suivante s’ouvre à la bonne page. Pas de nouveau PDF à fabriquer.', ['Nouveau programme, donnez-lui un nom', 'Ajoutez la musique : touchez la première et la dernière page', 'Jouer : la pédale vous mène jusqu’au bout']],
      perform: ['Concert', 'Sur scène, seulement la musique.', 'Le mode Concert cache tous les outils, pour qu’un geste involontaire n’ouvre jamais rien. Les tournes, la pédale et le clin d’œil fonctionnent toujours.'],
      pencil: ['Apple Pencil', 'Le premier contact n’écrit jamais.', 'Touchez la partition avec le Pencil et les outils s’ouvrent, rien de plus. Le trait suivant écrit. Le doigt continue de tourner les pages et de zoomer, et la main peut se poser sur l’écran : vous n’écrivez jamais par accident.', [['Stylo', 'Types, tailles, couleurs'], ['Surligneur', 'Couleur transparente'], ['Texte', 'Tapé, ou écrit au Pencil'], ['Gomme', 'Seulement vos annotations'], ['Gomme de partition', 'Enlève une liaison imprimée, garde la portée'], ['Deux couleurs', 'Noir et rouge, à portée de doigt'], ['Note', 'Une feuille transparente par-dessus'], ['Main sûre', 'Des traits plus calmes et plus droits']]],
      symbols: ['Symboles', 'Des symboles en un geste.', 'Choisissez un symbole, puis touchez la musique là où il doit aller.', ['pp à ff, sfz, fp', 'Tiré, poussé', 'Doigtés 0–4', 'Cordes I–IV', 'Point d’orgue, respiration, accent', 'rit., a tempo, pizz., arco', 'Lunettes (attention !)']],
      slurs: ['Liaisons', 'Dessinez une liaison, obtenez-la gravée.', 'Tracez de la première note à la dernière. Stand dessine une liaison nette et effilée, au-dessus ou en dessous, du côté où vous l’avez tracée.'],
      select: ['Sélection', 'Entourez : déplacez, copiez ou faites-en un passage.', 'Entourez ce que vous avez écrit pour le déplacer, le redimensionner, le copier ou l’effacer. Entourez des mesures et la première proposition est d’en faire un passage.'],
      clean: ['Copie propre', 'Vos annotations ne touchent jamais l’édition.', 'Les annotations restent séparées de la page imprimée. Masquez-les toutes avec l’œil, ou exportez la partition avec elles pour un élève, ou en copie propre.', ['Masquer les annotations', 'Exporter avec les annotations', 'Exporter une copie propre']],
      passages: ['Passages', 'Un carnet de tempo pour chaque endroit difficile.', 'Entourez les mesures, donnez au passage un type, un tempo de départ et un objectif. Notez chaque jour le tempo atteint : la barre se remplit vers l’objectif et un petit graphique montre votre meilleur jour après jour.', [['Mélodique', 'D’abord propre, puis vite'], ['Technique', '+5 bpm quand c’est propre'], ['Démanché', 'Lentement et en rythme'], ['Rythme', 'Le rythme seul d’abord'], ['Archet et souffle', 'Le motif tout seul'], ['Ce qui a été oublié', 'Les passages délaissés trop longtemps']]],
      session: ['Séance de travail', 'Tous vos passages, à une tourne de distance.', 'Donnez une priorité à chaque passage. Stand commence par les plus importants et par ceux qui sont le plus loin de leur objectif. Tourner la page mène au passage suivant, dans n’importe quelle partition, avec la page entière.', ['Haute · Moyenne · Basse · Passer', 'Priorité haute deux fois', 'Dans toutes vos partitions']],
      reps: ['Répétitions', 'Comptez les passages propres d’affilée.', 'Notez chaque passage propre et chaque faute : une faute remet le compteur à zéro. Fixez-vous un objectif de 3, 5, 7 ou 10.'],
      metronome: ['Métronome', 'Un métronome qui fait plus que tic-tac.', 'Tapez le tempo, accentuez ou faites taire n’importe quel temps, et laissez-le tourner vos pages. Il continue pendant que vous accordez, enregistrez ou changez d’app.', [['Mesure', 'De 1/4 à 12/8'], ['Subdivision', 'Croches, triolets, doubles'], ['Entraîneur de vitesse', 'Progressif ou par paliers'], ['Mesures muettes', 'Gardez le tempo vous-même'], ['Flash', 'Voir le premier temps'], ['Son', 'Clic, wood-block, bip']]],
      scales: ['Gammes', 'Des gammes en notes longues, ou rapides.', 'Toutes les tonalités, majeures, mineures et modes, chacune avec son tempo. Chaque note dure 4, 3, 2 ou 1 temps, ou 2 à 4 par temps, avec un clic net et un bourdon en dessous.', ['Chaque note : 4 temps', 'Bourdon sur la tonique', 'Tempérée, juste ou pythagoricienne', 'Son de piano, d’orgue ou d’archet', 'Une mesure pour rien']],
      log: ['Journal de travail', 'Voyez ce que vous avez vraiment travaillé.', 'Le temps compte tout seul tant qu’une partition est ouverte ou qu’un outil tourne. L’anneau de l’écran d’accueil se remplit vers votre objectif du jour.', [['Objectif du jour', 'De 15 minutes à 4 heures'], ['Série', 'Jours d’affilée'], ['Graphique', 'Semaine, mois, année'], ['Par œuvre', 'Minutes sur chacune'], ['Aujourd’hui', 'Une note sur la suite'], ['Minuteur', '25/5, 45/15, 60/20']]],
      plan: ['Planning de la semaine', 'Planifiez la semaine par demi-heures.', 'Coloriez les demi-heures où vous voulez travailler. Les semaines passées montrent en vert ce qui est fait et en rouge ce qui est manqué, et un rappel arrive quand la séance commence.', ['Au début, 10 ou 30 min avant', 'Se répète de semaine en semaine', 'Sur iPad et iPhone']],
      iphone: ['iPhone', 'Votre travail dans la poche.', 'L’iPhone montre la journée, la semaine et chaque œuvre de votre iPad, et garde les partitions de l’iPad pour les lire partout. Loin du pupitre, il a l’accordeur, les harmoniques, le bourdon, le métronome, les gammes, les répétitions, un minuteur et l’enregistrement, et il sert de caméra à l’iPad.', ['Les partitions de l’iPad, à lire', 'Temps de travail via iCloud', 'Caméra pour l’iPad']],
      tuner: ['Accordeur', 'Un accordeur qui apprend votre justesse.', 'L’aiguille indique les cents et la note devient verte quand c’est juste. Avec le temps, il apprend quelles notes vous jouez souvent trop haut ou trop bas.', [['La de référence', 'Par exemple 442 Hz'], ['Tempérée', 'Comme le piano'], ['Juste', 'Tierces et quintes pures'], ['Pythagoricienne', 'Quintes pures'], ['Tendance', 'Trop haut ou trop bas ces temps-ci'], ['Petit accordeur', 'Par-dessus la partition']]],
      harmonics: ['Harmoniques', 'Quelle harmonique, sur quelle corde, où poser le doigt.', 'Jouez une harmonique naturelle et Stand la nomme. Écoutez la série de n’importe quelle corde et voyez l’écart de chaque harmonique avec le piano : la 5e harmonique est 14 cents trop basse, la 7e 31 cents.'],
      drone: ['Bourdon', 'Un bourdon qui suit la musique.', 'Une note tenue en intervalles purs, pour que chaque battement entendu soit votre propre justesse. Son d’orgue, doux, d’archet ou de cor, avec la quinte ou l’octave si vous voulez. Quand la musique module, le bourdon peut suivre.', [['Je touche', 'Reste jusqu’à ce que vous changiez'], ['Il écoute', 'Change quand la tonalité change vraiment'], ['Ma liste', 'Vos notes, dans votre ordre'], ['Toutes les tonalités', 'Avance toutes les 2 à 16 mesures']]],
      record: ['Enregistrer', 'Enregistrez en lisant.', 'L’audio pour le meilleur son, ou la vidéo pour regarder votre posture. Une mesure pour rien au métronome, et la partition reste à l’écran.', ['Audio ou vidéo', 'Avant, arrière ou iPhone', 'Une mesure pour rien', 'Garder le clic']],
      camera: ['Caméra iPhone', 'Votre iPhone comme seconde caméra.', 'Ouvrez Stand sur l’iPhone et choisissez caméra pour l’iPad. Les deux se trouvent tout seuls. Réglez la luminosité, la couleur et le zoom depuis l’iPad, et la vidéo arrive après l’arrêt.'],
      recordings: ['Enregistrements', 'Réécoutez plus lentement, à la même hauteur.', 'Glissez sur la forme d’onde pour boucler un passage et l’écouter à 50–100 % de la vitesse, à la même hauteur. Ajoutez l’acoustique d’une salle ou d’une église et coupez ce qui ne sert pas. Studio pose la partition sur votre vidéo, qui suit votre jeu, au format carré ou vertical, prête à partager.', ['Boucle de A à B', 'Vitesse 50–100 %', 'Salle ou église', 'Couper', 'Studio : partition sur la vidéo', 'Lumière et couleur auto']],
      video: ['Vidéo sur la partition', 'Regardez-vous à côté de la musique.', 'Faites glisser une vidéo des Enregistrements sur la partition. Zoomez jusqu’à 5× sur le bras d’archet, ralentissez-la, et les pages tournent toujours en dessous.'],
      along: ['Écouter', 'Les grands enregistrements, à portée de doigt.', 'Gardez avec chaque partition les interprétations que vous aimez, sur YouTube, Spotify ou Apple Music. Ou jouez avec un fichier audio, plus lentement et en boucle entre A et B.'],
      composer: ['Compositeur', 'Écrivez au Pencil, écoutez le résultat.', 'Les notes se posent là où vous touchez la portée. Deux voix par portée, liaisons et soufflets d’une mesure à l’autre, maisons de reprise, et lecture avec des instruments d’orchestre échantillonnés.', ['De la ronde à la triple croche', 'Voix 1 / Voix 2', 'N-olets de 2 à 11', 'Transposer par intervalle ou tonalité', 'Ouvre le MusicXML']],
      instruments: ['Instruments', 'Plus de 100 instruments, chacun dans son ton.', 'Bois, cuivres, percussions, claviers, guitares, voix et cordes, avec tous les instruments transpositeurs et le brass band. Écrivez en sons réels ; les parties sortent dans le ton que lit chaque musicien.', ['Clarinette en la, si♭, mi♭', 'Cor en fa ou mi♭', 'Euphonium, alto (tenor horn)', 'Du solo à l’orchestre']],
      layout: ['Mise en page et son', 'Gravé comme il se doit.', 'Taille de la portée, papier et orientation, portées vides masquées et portées qui ne se chevauchent jamais. Choisissez la salle et le diapason, de la = 415 à 443.'],
      export: ['Exporter', 'Conducteur, parties, MusicXML et MIDI.', 'Tout ce dont un orchestre ou un ensemble a besoin, à partir d’une seule partition.', [['Conducteur', 'PDF, chacun dans son ton'], ['Toutes les parties', 'Transposées, silences multi-mesures'], ['Sons réels', 'Pour le chef'], ['MusicXML', 'Sibelius, Dorico, MuseScore'], ['Audio et MIDI', 'Fichiers WAV et MIDI'], ['Sur mon pupitre', 'À lire et annoter']]],
      capture: ['Lire la musique', 'De la page imprimée aux notes.', 'Choisissez des lignes dans un PDF, une numérisation ou une photo. Stand lit les notes, les rythmes, les silences, les altérations, la clé, l’armure et la mesure, et les colle dans n’importe quel instrument et à n’importe quelle mesure.', ['Compositeur ▸ Capture', 'Touchez ou glissez sur les lignes', 'Collez dans la partition']],
      notebooks: ['Cahiers', 'Du papier à musique avec une couverture.', 'Papier à portées, ligné ou blanc pour les exercices, les dictées, les notes de cours ou un journal de travail. Ajoutez des photos dans des formes ou dans un mot, des cartes en verre, du washi tape et des autocollants, et déplacez ce que vous voulez d’une page à l’autre.'],
    },
    also: ['iPad et iPhone ensemble', 'Sauvegarde dans iCloud Drive ou Fichiers', 'Bleu ou noir, clair ou sombre', 'Seulement vos outils sur l’écran d’accueil', 'Écouteurs et pédales Bluetooth', 'Fonctionne hors ligne'],
    high: [['Tournez la page sans lâcher l’archet.', 'Clignez de l’œil, appuyez sur une pédale, frappez le pupitre ou laissez Stand suivre votre jeu. La demi-page montre la suite : vous n’êtes jamais pris au dépourvu en bas de page.'],
      ['Travaillez les mesures difficiles, pas toute l’œuvre encore une fois.', 'Entourez les mesures à travailler, donnez-leur un tempo objectif et notez chaque jour ce que vous avez atteint. Une séance de travail vous mène d’un passage à l’autre, dans toutes vos partitions.'],
      ['Entendez où vous en êtes. Voyez comment vous jouez.', 'Un accordeur qui apprend quelles notes vous jouez trop haut ou trop bas. Filmez-vous en lisant, regardez-vous à côté de la musique, au ralenti, et posez la partition sur la vidéo pour la partager.'],
      ['De la page imprimée à votre propre partition.', 'Choisissez des lignes sur une numérisation ou un PDF et Stand lit les notes dans le compositeur. Arrangez-les pour plus de 100 instruments et imprimez les parties, chacune dans son ton.']],
    tools: ['Lecteur de partitions', 'Annotations au Pencil', 'Plan de travail', 'Métronome', 'Accordeur', 'Bourdon', 'Enregistreur et vidéo', 'Journal de travail', 'Notation', 'Cahiers'],
    faq: [['Sur quels appareils Stand fonctionne-t-il ?', 'iPad et iPhone avec iPadOS ou iOS 15 ou ultérieur. L’iPad est le pupitre ; l’iPhone garde votre travail, vos partitions à lire et les outils dans votre poche, et peut filmer pour l’iPad. Tourner les pages d’un clin d’œil utilise la caméra avant et fonctionne au mieux sur un iPad avec Face ID.'],
      ['Faut-il un compte ou Internet ?', 'Jamais de compte. Stand fonctionne hors ligne. Internet ne sert que lorsque vous demandez quelque chose en ligne, comme chercher une partition sur IMSLP ou ouvrir un enregistrement sur YouTube, Spotify ou Apple Music.'],
      ['Où sont gardées mes partitions ?', 'Sur votre appareil, dans Stand et dans un dossier Stand de l’app Fichiers (Partitions, Enregistrements, Sauvegardes). Sauvegardez tout dans un seul fichier quand vous voulez, par exemple dans iCloud Drive, et restaurez-le sur un nouvel iPad.'],
      ['Puis-je utiliser ma pédale tourne-page ?', 'Oui. Les pédales Bluetooth fonctionnent tout de suite. Vous pouvez aussi cligner de l’œil, toucher le bord de la page, frapper le pupitre, laisser le métronome tourner toutes les quelques mesures ou laisser Stand suivre votre jeu.'],
      ['Mes annotations modifient-elles le PDF ?', 'Jamais. Les annotations sont sur leur propre calque. Masquez-les d’un geste, ou exportez la partition avec elles ou en copie propre.'],
      ['Est-ce pour mon instrument ?', 'Stand est fait pour tous les musiciens qui lisent la musique : cordes, bois, cuivres, claviers, guitare, voix. L’accordeur, le bourdon, les harmoniques et les gammes sont particulièrement à l’aise avec les cordes, et le compositeur connaît plus de 100 instruments.']],
  },

  /* ---------------- Deutsch ---------------- */
  de: {
    f: { read: ['Lesen', 'Deine Noten auf dem Pult, zwei Seiten auf einmal, umgeblättert ohne die Hand zu heben.'],
      mark: ['Eintragen', 'Schreib mit dem Apple Pencil in die Noten, wie mit einem Bleistift auf Papier.'],
      practise: ['Üben', 'Wissen, was du üben musst, in welchem Tempo, und wie viel du wirklich geübt hast.'],
      listen: ['Stimmen & Aufnehmen', 'Hör genau, wo du stehst: Intonation, Tempo und Video.', 'Stimmen'],
      write: ['Schreiben', 'Komponieren, arrangieren, Noten abschreiben und Hefte führen.'] },
    c: {
      library: ['Bibliothek', 'Alle Noten an einem Ort.', 'Importiere PDFs und Fotos oder scanne Seiten mit der Kamera. Wie eine Scanner-App findet Stand die Seite, richtet sie an den Notenlinien gerade und entfernt die Schatten, damit ein Foto wie eine saubere Kopie aussieht. Titel und Komponist werden für dich gelesen.', ['Aus Dateien importieren', 'Mit der Kamera scannen', 'Ordner', 'Ein Stand-Ordner in der Dateien-App']],
      find: ['Noten finden', 'Gemeinfreie Noten in Sekunden.', 'Durchsuche die IMSLP-Bibliothek nach Komponist und Werk. Stand markiert die beste Ausgabe für dein Instrument, und sie landet in deiner Bibliothek, bereit zum Lesen und Eintragen. Für Ausgaben, die es wert sind, gibt es Links zu Henle, Bärenreiter und anderen Verlagen.', ['Tippe „Bach Cellosuite“', 'Wähle dein Instrument', 'Tippe auf ein Ergebnis']],
      turns: ['Umblättern', 'Sechs Arten umzublättern.', 'Zwei Seiten nebeneinander im Querformat, eine im Hochformat, oder eine Querformatseite gedreht auf einem hochkant stehenden Bildschirm. Blättere so um, wie es gerade passt.', [['Tippen oder wischen', 'An den Seitenrändern'], ['Pedal', 'Jedes Bluetooth-Pedal'], ['Zwinkern', 'Rechtes Auge vor, linkes zurück'], ['Zuhören', 'Folgt deinem Spiel und deinen Augen (Beta)'], ['Klopfen', 'Ein kräftiger Klopfer aufs Pult'], ['Metronom', 'Alle 2 bis 16 Takte']]],
      thisscore: ['Diese Noten', 'Jedes Stück so eingerichtet, wie du liest.', 'Mit dem halben Umblättern siehst du schon den Anfang der nächsten Seite, während du diese zu Ende spielst. So wartest du nie aufs Umblättern.', [['Halbe Seite', 'Sieh, was kommt'], ['Wiederholungen und Sprünge', 'D.C., Wiederholungen, Codas'], ['Lesezeichen', 'Zu einem Satz springen'], ['Papier', 'Weiß, warm oder Nacht'], ['Größere Noten', 'Ohne weiße Ränder'], ['PDF exportieren', 'Mit oder ohne Eintragungen']]],
      pages: ['Seiten', 'Korrigiere die Ausgabe, statt sie nur zu lesen.', 'Schneide eine Seite auf die Musik zu, die du brauchst, teile sie zwischen den Systemen oder zieh Zeilen hoch, damit die Wendestelle besser liegt. Füge Seiten aus einer Datei hinzu, dreh eine Seite richtig herum und nimm Seiten heraus: Nichts geht verloren, bis du es willst.', ['Zuschneiden', 'Zwischen Systemen teilen', 'Zeilen hochziehen', 'Seiten hinzufügen', 'Seite drehen', 'Alles zurück']],
      sets: ['Programme', 'Ein ganzes Konzert in einer Lesereihenfolge.', 'Wähle Seiten aus verschiedenen Noten für ein Vorspiel, eine Prüfung oder ein Konzert. Nach der letzten Seite eines Stücks öffnet sich das nächste an der richtigen Stelle. Kein neues PDF nötig.', ['Neues Programm, gib ihm einen Namen', 'Musik hinzufügen: erste und letzte Seite antippen', 'Spielen: das Pedal führt dich durch']],
      perform: ['Auftritt', 'Auf der Bühne nur die Musik.', 'Der Auftrittsmodus blendet alle Werkzeuge aus, damit eine versehentliche Berührung nie etwas öffnet. Umblättern, Pedal und Zwinkern funktionieren weiter.'],
      pencil: ['Apple Pencil', 'Die erste Berührung schreibt nie.', 'Berühre die Noten mit dem Pencil und die Werkzeuge öffnen sich, mehr nicht. Der nächste Strich schreibt. Dein Finger blättert und zoomt weiter, und die Hand darf auf dem Glas liegen, so schreibst du nie aus Versehen.', [['Stift', 'Arten, Stärken, Farben'], ['Textmarker', 'Durchscheinende Farbe'], ['Text', 'Tippen oder mit dem Pencil schreiben'], ['Radierer', 'Nur deine Eintragungen'], ['Notenradierer', 'Entfernt einen gedruckten Bogen, lässt die Linien stehen'], ['Zwei Farben', 'Schwarz und Rot, einen Tipp entfernt'], ['Notiz', 'Ein durchsichtiges Blatt darüber'], ['Ruhige Hand', 'Ruhigere, geradere Linien']]],
      symbols: ['Zeichen', 'Zeichen mit einem Tipp.', 'Wähle ein Zeichen und tippe in die Noten, wo es hingehört.', ['pp bis ff, sfz, fp', 'Abstrich, Aufstrich', 'Fingersätze 0–4', 'Saiten I–IV', 'Fermate, Atemzeichen, Akzent', 'rit., a tempo, pizz., arco', 'Brille (Achtung!)']],
      slurs: ['Bögen', 'Zeichne einen Bogen, bekomm einen gestochenen.', 'Zeichne von der ersten bis zur letzten Note. Stand zeichnet einen sauberen, spitz zulaufenden Bogen, oben oder unten, auf der Seite, auf der du gezeichnet hast.'],
      select: ['Auswählen', 'Einkreisen: verschieben, kopieren oder zur Übestelle machen.', 'Zieh eine Schlinge um das Geschriebene, um es zu verschieben, zu skalieren, zu kopieren oder zu löschen. Kreise Takte ein, und als Erstes wird eine Übestelle angeboten.'],
      clean: ['Saubere Kopie', 'Deine Eintragungen berühren nie die Ausgabe.', 'Eintragungen liegen getrennt von der gedruckten Seite. Blende alle mit dem Auge aus, oder exportiere die Noten mit ihnen für Schüler oder als saubere Kopie.', ['Eintragungen ausblenden', 'Mit Eintragungen exportieren', 'Saubere Kopie exportieren']],
      passages: ['Übestellen', 'Ein Tempo-Tagebuch für jede schwere Stelle.', 'Kreise die Takte ein und gib der Stelle eine Art, ein Starttempo und ein Ziel. Trag jeden Tag das erreichte Tempo ein: Der Balken füllt sich zum Ziel hin, und eine kleine Kurve zeigt deinen Bestwert Tag für Tag.', [['Melodisch', 'Erst sauber, dann schnell'], ['Technisch', '+5 bpm, wenn es sauber ist'], ['Lagenwechsel', 'Langsam und im Rhythmus'], ['Rhythmus', 'Erst nur den Rhythmus'], ['Strich und Atem', 'Das Muster für sich'], ['Was liegen blieb', 'Zu lange vernachlässigte Stellen']]],
      session: ['Übe-Einheit', 'Alle Übestellen, nur ein Umblättern entfernt.', 'Gib jeder Stelle eine Priorität. Stand beginnt mit den wichtigsten und denen, die am weitesten vom Ziel sind. Umblättern führt zur nächsten Stelle, in jedem Stück, mit der ganzen Seite.', ['Hoch · Mittel · Niedrig · Auslassen', 'Hohe Priorität zweimal', 'Über alle deine Noten']],
      reps: ['Wiederholungen', 'Zähle saubere Durchgänge am Stück.', 'Markiere jeden sauberen Durchgang und jeden Fehler: Ein Fehler setzt die Zählung zurück. Setz dir ein Ziel von 3, 5, 7 oder 10.'],
      metronome: ['Metronom', 'Ein Metronom, das mehr kann als klicken.', 'Tippe das Tempo, betone oder stumme jeden Schlag und lass es für dich umblättern. Es läuft weiter, während du stimmst, aufnimmst oder die App wechselst.', [['Taktart', '1/4 bis 12/8'], ['Unterteilung', 'Achtel, Triolen, Sechzehntel'], ['Tempotrainer', 'Fließend oder in Stufen'], ['Stumme Takte', 'Halte das Tempo selbst'], ['Blinken', 'Die Eins sehen'], ['Klang', 'Klick, Holzblock, Piep']]],
      scales: ['Tonleitern', 'Tonleitern in langen Tönen oder schnell.', 'Jede Tonart, Dur, Moll und Modi, mit eigenem Tempo. Jeder Ton dauert 4, 3, 2 oder 1 Schlag oder kommt 2- bis 4-mal pro Schlag, mit sauberem Klick und einem Bordun darunter.', ['Jeder Ton: 4 Schläge', 'Bordun auf dem Grundton', 'Gleichstufig, rein oder pythagoreisch', 'Klavier-, Orgel- oder Streicherklang', 'Ein Takt Vorzähler']],
      log: ['Übe-Tagebuch', 'Sieh, was du wirklich geübt hast.', 'Die Zeit läuft von selbst, solange Noten offen sind oder ein Werkzeug läuft. Der Ring auf dem Startbildschirm füllt sich zu deinem Tagesziel.', [['Tagesziel', '15 Minuten bis 4 Stunden'], ['Serie', 'Tage am Stück'], ['Diagramm', 'Woche, Monat, Jahr'], ['Pro Stück', 'Minuten an jedem'], ['Heute', 'Eine Notiz, was als Nächstes kommt'], ['Timer', '25/5, 45/15, 60/20']]],
      plan: ['Wochenplan', 'Plane deine Woche in halben Stunden.', 'Male die halben Stunden aus, in denen du üben willst. Vergangene Wochen zeigen Erledigtes grün und Verpasstes rot, und eine Erinnerung kommt, wenn das Üben beginnt.', ['Zu Beginn, 10 oder 30 Min. vorher', 'Läuft Woche für Woche weiter', 'Auf iPad und iPhone']],
      iphone: ['iPhone', 'Dein Üben in der Hosentasche.', 'Das iPhone zeigt den Tag, die Woche und jedes Stück von deinem iPad und hält die Noten des iPads für unterwegs bereit. Fern vom Pult hat es Stimmgerät, Flageoletts, Bordun, Metronom, Tonleitern, Wiederholungen, einen Übe-Timer und Aufnahme, und es dient dem iPad als Kamera.', ['Die Noten vom iPad, zum Lesen', 'Übezeit über iCloud', 'Kamera fürs iPad']],
      tuner: ['Stimmgerät', 'Ein Stimmgerät, das deine Intonation lernt.', 'Die Nadel zeigt die Cent, und der Ton wird grün, wenn er stimmt. Mit der Zeit lernt es, welche Töne du gern zu hoch oder zu tief spielst.', [['Kammerton A', 'Zum Beispiel 442 Hz'], ['Gleichstufig', 'Wie das Klavier'], ['Rein', 'Reine Terzen und Quinten'], ['Pythagoreisch', 'Reine Quinten'], ['Tendenz', 'Zuletzt zu hoch oder zu tief'], ['Kleines Stimmgerät', 'Über den Noten']]],
      harmonics: ['Flageoletts', 'Welches Flageolett, auf welcher Saite, wo berühren.', 'Spiel ein natürliches Flageolett und Stand nennt es. Hör die Obertonreihe jeder Saite und sieh, wie weit jeder Oberton vom Klavier abweicht: der 5. ist 14 Cent zu tief, der 7. 31 Cent.'],
      drone: ['Bordun', 'Ein Bordun, der der Musik folgt.', 'Ein gehaltener Ton in reinen Intervallen, damit jede Schwebung, die du hörst, deine eigene Intonation ist. Orgel-, weicher, Streicher- oder Hornklang, auf Wunsch mit Quinte oder Oktave. Wenn die Musik moduliert, kann der Bordun folgen.', [['Ich tippe', 'Bleibt, bis du ihn änderst'], ['Er hört zu', 'Wechselt, wenn die Tonart wirklich wechselt'], ['Meine Liste', 'Deine Töne, in deiner Reihenfolge'], ['Alle Tonarten', 'Weiter alle 2 bis 16 Takte']]],
      record: ['Aufnehmen', 'Nimm auf, während du liest.', 'Audio für den besten Klang oder Video, um deine Haltung zu sehen. Ein Takt Vorzähler vom Metronom, und die Noten bleiben auf dem Bildschirm.', ['Audio oder Video', 'Vorne, hinten oder iPhone', 'Ein Takt Vorzähler', 'Klick weiterlaufen lassen']],
      camera: ['iPhone-Kamera', 'Dein iPhone als zweite Kamera.', 'Öffne Stand auf dem iPhone und wähle Kamera fürs iPad. Die beiden finden sich von selbst. Stell Helligkeit, Farbe und Zoom vom iPad aus ein, und das Video kommt nach dem Stoppen herüber.'],
      recordings: ['Aufnahmen', 'Langsamer anhören, in derselben Tonhöhe.', 'Zieh über die Wellenform, um eine Stelle zu wiederholen, und hör sie mit 50–100 % Tempo in derselben Tonhöhe. Füge den Klang eines Saals oder einer Kirche hinzu und schneide weg, was du nicht brauchst. Studio legt die Noten über dein Video, mitlaufend mit deinem Spiel, quadratisch oder hochkant und bereit zum Teilen.', ['Schleife von A nach B', '50–100 % Tempo', 'Saal oder Kirche', 'Schneiden', 'Studio: Noten im Video', 'Licht und Farbe automatisch']],
      video: ['Video über den Noten', 'Sieh dich neben der Musik.', 'Zieh ein Video aus den Aufnahmen auf die Noten. Zoome bis 5× auf den Bogenarm, verlangsame es, und die Seiten blättern darunter weiter.'],
      along: ['Mithören', 'Große Aufnahmen, einen Tipp entfernt.', 'Bewahre zu jedem Stück die Interpretationen auf, die du liebst, auf YouTube, Spotify oder Apple Music. Oder spiel zu einer Audiodatei, langsamer und in einer Schleife zwischen A und B.'],
      composer: ['Komponieren', 'Mit dem Pencil schreiben, gespielt hören.', 'Die Noten landen dort, wo du das System berührst. Zwei Stimmen pro System, Bögen und Gabeln über Taktgrenzen, Volten und Wiederholungen, und Abspielen mit gesampelten Orchesterinstrumenten.', ['Ganze bis Zweiunddreißigstel', 'Stimme 1 / Stimme 2', 'N-tolen von 2 bis 11', 'Transponieren nach Intervall oder Tonart', 'Öffnet MusicXML']],
      instruments: ['Instrumente', 'Mehr als 100 Instrumente, jedes in seiner Stimmung.', 'Holz, Blech, Schlagwerk, Tasteninstrumente, Gitarren, Stimmen und Streicher, mit allen transponierenden Instrumenten und der Brass Band. Schreib klingend; die Stimmen kommen in der Tonart heraus, die jeder Spieler liest.', ['Klarinette in A, B, Es', 'Horn in F oder Es', 'Euphonium, Tenorhorn', 'Vom Solo bis zum Orchester']],
      layout: ['Satz und Klang', 'Gestochen, wie es sich gehört.', 'Systemgröße, Papier und Ausrichtung, leere Systeme ausgeblendet und Systeme, die nie kollidieren. Wähle den Raum und die Stimmung, von A = 415 bis 443.'],
      export: ['Exportieren', 'Partitur, Stimmen, MusicXML und MIDI.', 'Alles, was eine Band oder ein Orchester braucht, aus einer einzigen Partitur.', [['Partitur', 'PDF, jedes in seiner Stimmung'], ['Alle Stimmen', 'Transponiert, mit Mehrtaktpausen'], ['Klingend', 'Für die Dirigentin'], ['MusicXML', 'Sibelius, Dorico, MuseScore'], ['Audio und MIDI', 'WAV- und MIDI-Dateien'], ['Auf mein Pult', 'Lesen und eintragen']]],
      capture: ['Noten lesen', 'Von der gedruckten Seite zu Noten.', 'Wähle Zeilen in einem PDF, einem Scan oder einem Foto. Stand liest Noten, Rhythmen, Pausen, Vorzeichen, Schlüssel, Tonart und Takt und fügt sie in jedes Instrument und jeden Takt ein.', ['Komponieren ▸ Erfassen', 'Über die Zeilen tippen oder wischen', 'In die Partitur einfügen']],
      notebooks: ['Hefte', 'Notenpapier mit Umschlag.', 'Noten-, Linien- oder leeres Papier für Übungen, Diktate, Unterrichtsnotizen oder ein Übe-Tagebuch. Füge Fotos in Formen oder in einem Wort ein, Glaskarten, Washi-Tape und Sticker, und verschiebe alles zwischen den Seiten.'],
    },
    also: ['iPad und iPhone zusammen', 'Sicherung in iCloud Drive oder Dateien', 'Blau oder Schwarz, hell oder dunkel', 'Nur deine Werkzeuge auf dem Startbildschirm', 'Bluetooth-Kopfhörer und -Pedale', 'Funktioniert offline'],
    high: [['Umblättern, ohne den Bogen loszulassen.', 'Zwinkere, tritt aufs Pedal, klopf aufs Pult oder lass Stand deinem Spiel folgen. Das halbe Umblättern zeigt, was kommt, damit dich das Seitenende nie überrascht.'],
      ['Übe die schweren Takte, nicht das ganze Stück noch einmal.', 'Kreise die Takte ein, die Arbeit brauchen, gib ihnen ein Zieltempo und trag jeden Tag ein, was du geschafft hast. Eine Übe-Einheit führt dich von Stelle zu Stelle, über alle deine Noten.'],
      ['Hör, wo du stehst. Sieh, wie du spielst.', 'Ein Stimmgerät, das lernt, welche Töne du zu hoch oder zu tief spielst. Filme dich beim Lesen, sieh dich neben der Musik, langsamer, und leg die Noten zum Teilen über das Video.'],
      ['Von der gedruckten Seite zur eigenen Partitur.', 'Wähle Zeilen in einem Scan oder PDF, und Stand liest die Noten in den Editor. Arrangiere sie für mehr als 100 Instrumente und druck die Stimmen, jede in ihrer Stimmung.']],
    tools: ['Notenleser', 'Eintragen mit dem Pencil', 'Übeplan', 'Metronom', 'Stimmgerät', 'Bordun', 'Rekorder und Video', 'Übe-Tagebuch', 'Notensatz', 'Hefte'],
    faq: [['Auf welchen Geräten läuft Stand?', 'Auf iPad und iPhone mit iPadOS oder iOS 15 oder neuer. Das iPad ist das Notenpult; das iPhone trägt dein Üben, deine Noten zum Lesen und die Werkzeuge in der Tasche und kann fürs iPad filmen. Umblättern per Zwinkern nutzt die Frontkamera und funktioniert am besten auf einem iPad mit Face ID.'],
      ['Brauche ich ein Konto oder Internet?', 'Nie ein Konto. Stand funktioniert offline. Das Internet wird nur genutzt, wenn du etwas online anfragst, etwa Noten auf IMSLP suchst oder eine Aufnahme auf YouTube, Spotify oder Apple Music öffnest.'],
      ['Wo liegen meine Noten?', 'Auf deinem Gerät, in Stand und in einem Stand-Ordner in der Dateien-App (Noten, Aufnahmen, Sicherungen). Sichere alles in eine einzige Datei, wann du willst, zum Beispiel in iCloud Drive, und stell sie auf einem neuen iPad wieder her.'],
      ['Kann ich mein Blätterpedal benutzen?', 'Ja. Bluetooth-Blätterpedale funktionieren sofort. Du kannst auch zwinkern, an den Seitenrand tippen, aufs Pult klopfen, das Metronom alle paar Takte umblättern lassen oder Stand deinem Spiel folgen lassen.'],
      ['Verändern meine Eintragungen das PDF?', 'Nie. Eintragungen liegen auf einer eigenen Ebene. Blende sie mit einem Tipp aus oder exportiere die Noten mit ihnen oder als saubere Kopie.'],
      ['Ist es etwas für mein Instrument?', 'Stand ist für alle Musikerinnen und Musiker gemacht, die Noten lesen: Streicher, Holz, Blech, Tasten, Gitarre, Gesang. Stimmgerät, Bordun, Flageoletts und Tonleitern sind bei Streichern besonders zu Hause, und der Editor kennt mehr als 100 Instrumente.']],
  },

  /* ---------------- Italiano ---------------- */
  it: {
    f: { read: ['Leggere', 'I tuoi spartiti sul leggio, due pagine alla volta, girate senza alzare la mano.'],
      mark: ['Annotare', 'Scrivi sulla musica con l’Apple Pencil, come faresti con una matita sulla carta.'],
      practise: ['Studiare', 'Sapere cosa studiare, a che velocità, e quanto hai studiato davvero.'],
      listen: ['Accordare & Registrare', 'Senti esattamente dove sei: intonazione, tempo e video.', 'Accordare'],
      write: ['Scrivere', 'Componi, arrangia e copia musica, e tieni quaderni.'] },
    c: {
      library: ['Libreria', 'Tutti gli spartiti in un posto solo.', 'Importa PDF e foto, o scansiona le pagine con la fotocamera. Come un’app scanner, Stand trova la pagina, la raddrizza seguendo le righe del pentagramma e toglie le ombre, così una foto sembra una copia pulita. Titolo e compositore vengono letti per te.', ['Importa da File', 'Scansiona con la fotocamera', 'Cartelle', 'Una cartella Stand nell’app File']],
      find: ['Trova uno spartito', 'Spartiti di pubblico dominio in pochi secondi.', 'Cerca nella biblioteca IMSLP per compositore e brano. Stand segnala l’edizione migliore per il tuo strumento, che arriva nella tua libreria pronta da leggere e annotare. Per le edizioni che vale la pena avere, ci sono link a Henle, Bärenreiter e altri editori.', ['Scrivi “Bach suite violoncello”', 'Scegli il tuo strumento', 'Tocca un risultato']],
      turns: ['Girare pagina', 'Sei modi per girare pagina.', 'Due pagine affiancate in orizzontale, una in verticale, oppure una pagina orizzontale ruotata su uno schermo verticale. Girale nel modo più comodo al momento.', [['Tocca o scorri', 'Sui bordi della pagina'], ['Pedale', 'Qualsiasi pedale Bluetooth'], ['Occhiolino', 'Occhio destro avanti, sinistro indietro'], ['Ascolto', 'Segue quello che suoni, e i tuoi occhi (beta)'], ['Colpo', 'Un colpo deciso sul leggio'], ['Metronomo', 'Ogni 2–16 battute']]],
      thisscore: ['Questo spartito', 'Ogni spartito impostato come lo leggi tu.', 'Con la mezza pagina vedi l’inizio della pagina successiva mentre finisci questa, così non aspetti mai un cambio pagina.', [['Mezza pagina', 'Vedi cosa viene dopo'], ['Ritornelli e salti', 'D.C., ritornelli, code'], ['Segnalibri', 'Vai a un movimento'], ['Carta', 'Bianca, calda o notte'], ['Musica più grande', 'Senza margini bianchi'], ['Esporta PDF', 'Con o senza annotazioni']]],
      pages: ['Pagine', 'Correggi l’edizione, non limitarti a leggerla.', 'Ritaglia una pagina sulla musica che ti serve, tagliala tra i sistemi o sposta righe in alto perché il cambio pagina cada in un punto migliore. Aggiungi pagine da un file, raddrizza una pagina e togli pagine: non si perde nulla finché non lo decidi tu.', ['Ritaglia', 'Taglia tra i sistemi', 'Sposta righe in alto', 'Aggiungi pagine', 'Ruota una pagina', 'Ripristina tutto']],
      sets: ['Scalette', 'Un intero concerto in un solo ordine di lettura.', 'Scegli pagine da spartiti diversi per un’audizione, un esame o un concerto. Dopo l’ultima pagina di un brano, lo spartito successivo si apre alla pagina giusta. Nessun PDF nuovo da preparare.', ['Nuova scaletta, dalle un nome', 'Aggiungi musica: tocca la prima e l’ultima pagina', 'Suona: il pedale ti porta fino in fondo']],
      perform: ['Concerto', 'Sul palco, solo la musica.', 'La modalità Concerto nasconde tutti gli strumenti, così un tocco involontario non apre mai nulla. Cambi pagina, pedale e occhiolino continuano a funzionare.'],
      pencil: ['Apple Pencil', 'Il primo tocco non scrive mai.', 'Tocca lo spartito con il Pencil e si aprono gli strumenti, nient’altro. Il tratto successivo scrive. Il dito continua a girare pagina e a zoomare, e la mano può appoggiarsi sul vetro, così non scrivi mai per sbaglio.', [['Penna', 'Tipi, spessori, colori'], ['Evidenziatore', 'Colore trasparente'], ['Testo', 'Digitalo o scrivilo con il Pencil'], ['Gomma', 'Solo le tue annotazioni'], ['Gomma dello spartito', 'Toglie una legatura stampata, lascia il pentagramma'], ['Due colori', 'Nero e rosso, a un tocco'], ['Nota', 'Un foglio trasparente sopra'], ['Mano ferma', 'Linee più calme e dritte']]],
      symbols: ['Simboli', 'Simboli con un tocco.', 'Scegli un simbolo, poi tocca la musica dove va.', ['Da pp a ff, sfz, fp', 'Arcata in giù, in su', 'Diteggiature 0–4', 'Corde I–IV', 'Corona, respiro, accento', 'rit., a tempo, pizz., arco', 'Occhiali (attenzione!)']],
      slurs: ['Legature', 'Disegna una legatura, ottienila incisa.', 'Traccia dalla prima nota all’ultima. Stand disegna una legatura pulita e affusolata, sopra o sotto, dal lato in cui l’hai tracciata.'],
      select: ['Seleziona', 'Cerchialo: spostalo, copialo o fanne un passaggio.', 'Disegna un laccio intorno a ciò che hai scritto per spostarlo, ridimensionarlo, copiarlo o cancellarlo. Cerchia delle battute e la prima proposta è farne un passaggio.'],
      clean: ['Copia pulita', 'Le tue annotazioni non toccano mai l’edizione.', 'Le annotazioni restano separate dalla pagina stampata. Nascondile tutte con l’occhio, o esporta lo spartito con le annotazioni per un allievo, o come copia pulita.', ['Nascondi le annotazioni', 'Esporta con annotazioni', 'Esporta una copia pulita']],
      passages: ['Passaggi', 'Un registro del tempo per ogni punto difficile.', 'Cerchia le battute, dai al passaggio un tipo, un tempo di partenza e un obiettivo. Annota ogni giorno il tempo raggiunto: la barra si riempie verso l’obiettivo e un piccolo grafico mostra il tuo meglio, giorno dopo giorno.', [['Melodico', 'Prima pulito, poi veloce'], ['Tecnico', '+5 bpm quando è pulito'], ['Cambio di posizione', 'Lento e a tempo'], ['Ritmo', 'Prima solo il ritmo'], ['Arcata e respiro', 'Lo schema da solo'], ['Quello che hai trascurato', 'Passaggi lasciati da parte troppo a lungo']]],
      session: ['Sessione di studio', 'Tutti i tuoi passaggi, a un cambio pagina di distanza.', 'Dai una priorità a ogni passaggio. Stand comincia dai più importanti e da quelli più lontani dall’obiettivo. Girare pagina porta al passaggio successivo, in qualsiasi spartito, con la pagina intera.', ['Alta · Media · Bassa · Salta', 'Priorità alta due volte', 'In tutti i tuoi spartiti']],
      reps: ['Ripetizioni', 'Conta le esecuzioni pulite di fila.', 'Segna ogni esecuzione pulita e ogni errore: un errore fa ripartire il conteggio. Fissa un obiettivo di 3, 5, 7 o 10.'],
      metronome: ['Metronomo', 'Un metronomo che fa più di un clic.', 'Batti il tempo con il dito, accentua o silenzia qualsiasi battito e lascia che giri le tue pagine. Continua mentre accordi, registri o cambi app.', [['Tempo', 'Da 1/4 a 12/8'], ['Suddivisione', 'Crome, terzine, semicrome'], ['Allenatore di velocità', 'Graduale o a gradini'], ['Battute mute', 'Tieni il tempo da solo'], ['Lampo', 'Vedi il primo tempo'], ['Suono', 'Clic, woodblock, bip']]],
      scales: ['Scale', 'Scale a note lunghe, o veloci.', 'Qualsiasi tonalità, maggiore, minori e modi, ognuna con il suo tempo. Ogni nota dura 4, 3, 2 o 1 battiti, o va da 2 a 4 per battito, con un clic pulito e un bordone sotto.', ['Ogni nota: 4 battiti', 'Bordone sulla tonica', 'Temperata, naturale o pitagorica', 'Suono di pianoforte, organo o arco', 'Una battuta d’attacco']],
      log: ['Diario di studio', 'Guarda cosa hai studiato davvero.', 'Il tempo si conta da solo mentre uno spartito è aperto o uno strumento è in funzione. L’anello nella schermata iniziale si riempie verso il tuo obiettivo giornaliero.', [['Obiettivo giornaliero', 'Da 15 minuti a 4 ore'], ['Serie', 'Giorni di fila'], ['Grafico', 'Settimana, mese, anno'], ['Per brano', 'Minuti su ciascuno'], ['Oggi', 'Una nota su cosa viene dopo'], ['Timer', '25/5, 45/15, 60/20']]],
      plan: ['Piano settimanale', 'Pianifica la settimana a mezz’ore.', 'Colora le mezz’ore in cui vuoi studiare. Le settimane passate mostrano in verde ciò che hai fatto e in rosso ciò che hai saltato, e arriva un promemoria quando lo studio comincia.', ['All’inizio, 10 o 30 min prima', 'Continua settimana dopo settimana', 'Su iPad e iPhone']],
      iphone: ['iPhone', 'Il tuo studio in tasca.', 'L’iPhone mostra la giornata, la settimana e ogni brano del tuo iPad, e tiene gli spartiti dell’iPad da leggere ovunque. Lontano dal leggio ha accordatore, armonici, bordone, metronomo, scale, ripetizioni, un timer e la registrazione, e fa da fotocamera per l’iPad.', ['Gli spartiti dell’iPad, da leggere', 'Tempo di studio via iCloud', 'Fotocamera per l’iPad']],
      tuner: ['Accordatore', 'Un accordatore che impara la tua intonazione.', 'L’ago mostra i cent e la nota diventa verde quando sei intonato. Col tempo impara quali note tendi a suonare crescenti o calanti.', [['La di riferimento', 'Per esempio 442 Hz'], ['Temperata', 'Come il pianoforte'], ['Naturale', 'Terze e quinte pure'], ['Pitagorica', 'Quinte pure'], ['Tendenza', 'Crescente o calante ultimamente'], ['Accordatore piccolo', 'Sopra lo spartito']]],
      harmonics: ['Armonici', 'Quale armonico, su quale corda, dove toccare.', 'Suona un armonico naturale e Stand ti dice qual è. Ascolta la serie di qualsiasi corda e guarda quanto ogni armonico si allontana dal pianoforte: il 5° armonico è calante di 14 cent, il 7° di 31.'],
      drone: ['Bordone', 'Un bordone che segue la musica.', 'Una nota tenuta in intervalli puri, così ogni battimento che senti è la tua intonazione. Suono d’organo, morbido, d’arco o di corno, con la quinta o l’ottava se vuoi. Quando la musica cambia tonalità, il bordone può seguirla.', [['Tocco io', 'Resta finché non lo cambi'], ['Ascolta', 'Cambia quando la tonalità cambia davvero'], ['La mia lista', 'Le tue note, nel tuo ordine'], ['Tutte le tonalità', 'Avanza ogni 2–16 battute']]],
      record: ['Registra', 'Registra mentre leggi.', 'Audio per il suono migliore, o video per guardare la postura. Una battuta d’attacco dal metronomo, e lo spartito resta sullo schermo.', ['Audio o video', 'Anteriore, posteriore o iPhone', 'Una battuta d’attacco', 'Tieni il clic']],
      camera: ['Fotocamera dell’iPhone', 'Il tuo iPhone come seconda fotocamera.', 'Apri Stand sull’iPhone e scegli fotocamera per l’iPad. I due si trovano da soli. Regola luminosità, colore e zoom dall’iPad, e il video arriva quando ti fermi.'],
      recordings: ['Registrazioni', 'Riascolta più lento, alla stessa altezza.', 'Trascina sulla forma d’onda per ripetere un passaggio e ascoltarlo al 50–100% della velocità, alla stessa altezza. Aggiungi l’acustica di una sala o di una chiesa e taglia ciò che non ti serve. Studio mette lo spartito sul tuo video, che segue quello che suoni, quadrato o verticale e pronto da condividere.', ['Ripeti da A a B', 'Velocità 50–100%', 'Sala o chiesa', 'Taglia', 'Studio: spartito sul video', 'Luce e colore automatici']],
      video: ['Video sopra lo spartito', 'Guardati accanto alla musica.', 'Trascina un video dalle Registrazioni sopra lo spartito. Zooma fino a 5× sul braccio dell’arco, rallentalo, e le pagine continuano a girare sotto.'],
      along: ['Ascolta', 'Grandi registrazioni, a un tocco.', 'Conserva con ogni spartito le interpretazioni che ami, su YouTube, Spotify o Apple Music. Oppure suona con un file audio, più lento e in loop tra A e B.'],

function toCh(k) {
  const el = body.querySelectorAll('.ch')[k]; if (!el) return;
  const y = el.getBoundingClientRect().top - sheet.getBoundingClientRect().top + sheet.scrollTop - (narrow() ? 70 : 0);
  sheet.scrollTo({ top: y, behavior: reduce() ? 'auto' : 'smooth' });
}
function setActive(k) {
  if (k === active) return;
  active = k;
  const f = F[cur]; if (!f) return;
  body.querySelectorAll('.ch').forEach((c, j) => c.classList.toggle('now', j === k));
  body.querySelectorAll('.media .dev').forEach((d, j) => { d.classList.toggle('on', j === k); d.classList.toggle('before', j < k); d.classList.toggle('after', j > k); });
  body.querySelectorAll('.tiles button').forEach((b, j) => b.classList.toggle('now', j === k));
  barC.classList.remove('show');
  requestAnimationFrame(() => { barC.textContent = f.ch[k].name; barC.classList.add('show'); });
}
function watch() {
  io && io.disconnect(); ioR && ioR.disconnect();
  /* reveal: things rise into place as they come up, and settle back when you scroll away above them */
  ioR = new IntersectionObserver((es) => es.forEach((e) => {
    if (e.isIntersecting) e.target.classList.add('in');
    else if (e.boundingClientRect.top > 0) e.target.classList.remove('in');
  }), { root: sheet, threshold: 0.12 });
  body.querySelectorAll('.rv').forEach((el) => ioR.observe(el));
  /* the chapter in the middle of the screen is the one shown on the iPad */
  io = new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) setActive(+e.target.dataset.k); }),
    { root: sheet, rootMargin: '-45% 0px -45% 0px', threshold: 0 });
  body.querySelectorAll('.ch').forEach((el) => io.observe(el));
}
sheet.addEventListener('scroll', () => {
  const p = sheet.scrollTop / Math.max(1, sheet.scrollHeight - sheet.clientHeight);
  sheet.style.setProperty('--p', p.toFixed(4));
  sheet.classList.toggle('scrolled', sheet.scrollTop > 40);
}, { passive: true });

const clip = (r) => `inset(${Math.max(0, r.top)}px ${Math.max(0, innerWidth - r.right)}px ${Math.max(0, innerHeight - r.bottom)}px ${Math.max(0, r.left)}px round 18px)`;
/* lock the page behind the open folder, so iPhone Safari cannot scroll it away underneath */
let savedY = 0;
function lock() {
  if (document.body.classList.contains('locked')) return;
  savedY = scrollY; document.body.style.top = -savedY + 'px'; document.body.classList.add('locked');
}
function unlock() {
  if (!document.body.classList.contains('locked')) return;
  document.body.classList.remove('locked'); document.body.style.top = '';
  scrollTo(0, savedY); requestAnimationFrame(() => { if (Math.abs(scrollY - savedY) > 2) scrollTo(0, savedY); });
}
function show() { lock(); sheet.hidden = false; sheet.scrollTop = 0; }
/* the folder is a history step, so the iPhone back swipe or the browser Back button closes it instead of leaving the site */
let pushed = false;
try { history.scrollRestoration = 'manual'; } catch {}
const setHash = (id, push) => {
  try {
    if (push) { history.pushState({ stand: id }, '', '#' + id); pushed = true; }
    else history.replaceState(pushed ? { stand: id } : null, '', id ? '#' + id : location.pathname + location.search);
  } catch {}
};
async function openFolder(i, el) {
  if (busy) return; busy = true; cur = i; origin = el;
  hover(-1); show(); fill(i);
  setHash(F[i].id, true);
  if (reduce()) { sheet.classList.add('in'); busy = false; document.getElementById('closeBtn').focus(); return; }
  sheet.hidden = true;
  el.classList.remove('shift'); el.classList.add('pull');
  await new Promise((r) => setTimeout(r, 190));
  const r = el.getBoundingClientRect();
  sheet.hidden = false;
  const a = sheet.animate([{ clipPath: clip(r) }, { clipPath: 'inset(0px 0px 0px 0px round 0px)' }], { duration: 620, easing: 'cubic-bezier(.2,.8,.2,1)' });
  setTimeout(() => sheet.classList.add('in'), 180);
  await a.finished.catch(() => {});
  el.classList.remove('pull'); busy = false;
  document.getElementById('closeBtn').focus({ preventScroll: true });
}
async function closeFolder(fromHistory = false) {
  if (busy || sheet.hidden) return; busy = true;
  const el = origin && document.contains(origin) ? origin : els[cur];
  if (!fromHistory) setHash('', false);
  pushed = false;
  if (!reduce() && el && !(fromHistory && !canHover())) {
    sheet.classList.remove('in');
    const a = sheet.animate([{ clipPath: 'inset(0px 0px 0px 0px round 0px)' }, { clipPath: clip(el.getBoundingClientRect()) }], { duration: 440, easing: 'cubic-bezier(.4,0,.2,1)' });
    await a.finished.catch(() => {});
  }
  origin = null;
  sheet.hidden = true; sheet.classList.remove('in', 'scrolled', 'leaving'); sheet.getAnimations().forEach((a) => a.cancel());
  unlock(); hover(-1);
  document.querySelectorAll('.pull').forEach((e) => e.classList.remove('pull'));
  els.forEach((e) => e.classList.remove('lift', 'shift'));
  io && io.disconnect(); ioR && ioR.disconnect();
  busy = false; if (el && canHover()) el.focus({ preventScroll: true });
}
function go(i) {
  if (busy) return; busy = true;
  origin = null;
  const run = () => { cur = i; sheet.scrollTop = 0; fill(i); setHash(F[i].id, false); };
  if (reduce()) { run(); sheet.classList.add('in'); busy = false; return; }
  sheet.classList.add('leaving');
  setTimeout(() => {
    sheet.classList.remove('in'); run();
    sheet.classList.remove('leaving');
    requestAnimationFrame(() => requestAnimationFrame(() => { sheet.classList.add('in'); busy = false; }));
  }, 320);
}
/* close: step back through history when we added the step, otherwise just close */
function requestClose() {
  if (busy || sheet.hidden) return;
  if (pushed && history.state && history.state.stand) history.back();
  else closeFolder();
}
document.getElementById('closeBtn').addEventListener('click', requestClose);
addEventListener('popstate', () => {
  const k = F.findIndex((f) => '#' + f.id === location.hash);
  if (k < 0) { if (!sheet.hidden) { busy = false; closeFolder(true); } return; }
  if (sheet.hidden) { cur = k; pushed = true; show(); fill(k); sheet.classList.add('in'); }
  else if (k !== cur) { busy = false; go(k); }
});
/* coming back to the page from another site (Safari back-forward cache): never leave the page locked or half-open */
addEventListener('pageshow', (e) => {
  if (!e.persisted) return;
  busy = false; els.forEach((x) => x.classList.remove('pull', 'lift', 'shift'));
  if (sheet.hidden) { unlock(); document.body.classList.remove('locked'); document.body.style.top = ''; }
  else sheet.classList.add('in');
});
document.getElementById('prevBtn').addEventListener('click', () => go((cur + n - 1) % n));
document.getElementById('nextBtn').addEventListener('click', () => go((cur + 1) % n));
addEventListener('keydown', (e) => {
  if (sheet.hidden) return;
  if (e.key === 'Escape') requestClose();
  if (e.key === 'ArrowRight') go((cur + 1) % n);
  if (e.key === 'ArrowLeft') go((cur + n - 1) % n);
});
/* highlights on the home page open a folder at the right chapter */
async function openAt(id, chId, el) {
  const i = F.findIndex((f) => f.id === id); if (i < 0) return;
  await openFolder(i, el || els[i]);
  const k = F[i].ch.findIndex((c) => c.id === chId);
  if (k > 0) setTimeout(() => toCh(k), reduce() ? 0 : 120);
}
document.querySelectorAll('[data-open]').forEach((b) => b.addEventListener('click', () => openAt(b.dataset.open, b.dataset.ch, b.closest('.high') || b)));
const barCta = document.getElementById('barCta'); if (barCta) barCta.innerHTML = ctaHTML();
/* every iPad and iPhone picture knows its own width, so bezel and corners stay in proportion */
const devRO = 'ResizeObserver' in window ? new ResizeObserver((es) => es.forEach((e) => e.target.style.setProperty('--w', e.target.offsetWidth + 'px'))) : null;
function sizeDevs(root = document) {
  root.querySelectorAll('.dev').forEach((d) => {
    d.style.setProperty('--w', (d.offsetWidth || 0) + 'px');
    if (devRO && !d.dataset.ro) { devRO.observe(d); d.dataset.ro = '1'; }
  });
}
sizeDevs();
const start = F.findIndex((f) => '#' + f.id === location.hash);
if (start >= 0) { cur = start; show(); fill(start); sheet.classList.add('in'); }
matchMedia(PHONE_MQ).addEventListener?.('change', () => { hover(-1); place(); });

</script>
