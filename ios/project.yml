name: Stand
options:
  bundleIdPrefix: com.paulo
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
targets:
  Stand:
    type: application
    platform: iOS
    sources:
      - path: Stand
        excludes:
          - "www/**"
      - path: Stand/www
        type: folder
        buildPhase: resources
    info:
      path: Stand/Info.plist
      properties:
        CFBundleDisplayName: Stand
        CFBundleName: Stand
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: ""
        UIRequiresFullScreen: false
        UIStatusBarStyle: UIStatusBarStyleDefault
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSMicrophoneUsageDescription: "Stand listens to your instrument for the tuner, harmonics, the drone that follows your key, turning pages as you play, and your recordings. Sound is analysed on this device and is not uploaded."
        NSCameraUsageDescription: "Stand uses the camera to film your practice, to scan sheet music, to let your iPhone film for your iPad, and (only if you turn it on) to see when you wink to turn the page. Wink detection happens on this device; no picture of your face is saved or sent."
        CFBundleDocumentTypes:
          - CFBundleTypeName: PDF score
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.adobe.pdf]
          - CFBundleTypeName: Image
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.image]
          - CFBundleTypeName: Stand backup
            LSHandlerRank: Owner
            LSItemContentTypes: [com.paulo.stand.backup]
        UTExportedTypeDeclarations:
          - UTTypeConformsTo: [public.data]
            UTTypeDescription: Stand backup
            UTTypeIdentifier: com.paulo.stand.backup
            UTTypeTagSpecification:
              public.filename-extension: [standbackup]
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        NSLocalNetworkUsageDescription: "Stand connects your iPhone and iPad so the iPhone can film for the iPad."
        NSPhotoLibraryAddUsageDescription: "Stand saves the videos and pictures you choose to export to your photo library."
        NSBonjourServices:
          - _stand-link._tcp
          - _stand-link._udp
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: false
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.paulo.stand
        PRODUCT_NAME: Stand
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "2.9"
        CURRENT_PROJECT_VERSION: "31"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        ENABLE_BITCODE: NO
