name: Build iPad app (IPA)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ipa:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Bundle the web app
        run: |
          mkdir -p ios/Stand/www
          cp -R index.html manifest.webmanifest css js vendor icons ios/Stand/www/

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cd ios && xcodegen generate

      - name: Build (unsigned)
        run: |
          cd ios
          xcodebuild -project Stand.xcodeproj -target Stand -configuration Release -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} MARKETING_VERSION=1.${{ github.run_number }} \
            build | tail -n 40

      - name: Package IPA
        run: |
          cd ios
          rm -rf Payload && mkdir Payload
          cp -R build/Release-iphoneos/Stand.app Payload/
          zip -qry Stand.ipa Payload
          ls -lh Stand.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Stand-ipa
          path: ios/Stand.ipa

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Stand 1.${{ github.run_number }}
          make_latest: true
          files: ios/Stand.ipa
          body: |
            Stand for iPad. Download **Stand.ipa** and install it with Sideloadly (or AltStore) using your Apple ID.
