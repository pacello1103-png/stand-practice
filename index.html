<style>
* { box-sizing: border-box; }
html { overflow-x: hidden; overflow-x: clip; }
body { margin: 0; -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body.locked { position: fixed; left: 0; right: 0; overflow: hidden; }
a { color: inherit; }
svg.i { width: 20px; height: 20px; flex: none; }
button { font: inherit; }
.wrap { max-width: 1400px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.drawer { position: relative; height: clamp(560px, 76vh, 780px); margin-block: 26px 18px; overflow-x: clip; }
.folder { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
.folder { position: absolute; top: 0; bottom: 0; border: 0; padding: 0; margin: 0; cursor: pointer; text-align: left; transition: transform .55s var(--ease); will-change: transform; }
.folder.lift { transform: translateY(-14px); }
.folder.shift { transform: translateX(var(--shift, 150px)); }
.folder.pull { transform: translateY(-46px); transition-duration: .22s; }
.folder .strip { position: absolute; left: 0; top: 0; bottom: 0; width: var(--strip, 70px); display: flex; flex-direction: column; justify-content: space-between; padding: 24px 0 22px; }
.folder .peek { position: absolute; left: calc(var(--strip, 70px) + 8px); right: 18px; top: 22px; bottom: 22px; overflow: hidden; }
.folder .peek img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 30%; display: block; transition: filter .5s, opacity .5s, transform .8s var(--ease); }
.folder:focus-visible .peek img, .folder.lift .peek img { transform: scale(1.03); }
.folder .contents { list-style: none; margin: 0; padding: 0 40px 0 20px; display: grid; gap: 5px; }
.folder .name { align-self: flex-start; }
.cover { cursor: default; }
.cover::before { display: none; }

/* ---------- open folder ---------- */
.sheet { position: fixed; inset: 0; z-index: 30; overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain; background: var(--s-bg); color: var(--s-ink); }
.sheet .bar { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 10px; padding-block: calc(12px + env(safe-area-inset-top, 0px)) 12px; padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)); transition: background .3s, box-shadow .3s; }
.sheet.scrolled .bar { background: var(--bar-bg); box-shadow: 0 1px 0 var(--s-rule); backdrop-filter: saturate(1.6) blur(18px); -webkit-backdrop-filter: saturate(1.6) blur(18px); }
.bar .t { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; white-space: nowrap; overflow: hidden; }
.bar .t > span { display: flex; align-items: center; gap: 10px; }
.bar .ch-name { opacity: 0; transform: translateY(8px); transition: opacity .35s var(--ease), transform .45s var(--ease); color: var(--s-muted); overflow: hidden; text-overflow: ellipsis; }
.sheet.scrolled .bar .ch-name.show { opacity: 1; transform: none; }
.bar .ch-name::before { content: "/"; margin-right: 10px; opacity: .5; }
.bar .progress { position: absolute; left: 0; bottom: -1px; height: 2px; width: 100%; transform-origin: 0 50%; transform: scaleX(var(--p, 0)); background: var(--s-accent); opacity: .8; }
.icon { width: 40px; height: 40px; flex: none; border-radius: 12px; border: 0; display: grid; place-items: center; cursor: pointer; background: var(--icon-bg); color: inherit; transition: background .2s, transform .2s; }
.icon:hover { background: var(--icon-bg-h); }
.icon:active { transform: scale(.94); }
.icon svg { width: 18px; height: 18px; }

.sbody { max-width: 1240px; margin: 0 auto; padding-left: max(22px, env(safe-area-inset-left, 0px)); padding-right: max(22px, env(safe-area-inset-right, 0px)); }
.hero { min-height: calc(100vh - 66px); min-height: calc(100svh - 66px); display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: center; gap: 56px; padding-block: 30px 40px; position: relative; }
.htext { display: grid; grid-template-columns: minmax(0, 1fr); justify-items: start; gap: 22px; min-width: 0; }
.hdev { min-width: 0; transform: translateY(40px) scale(.94) rotate(-1.5deg); }
.sheet.in .hdev.in { transform: translateY(calc(var(--p, 0) * -160px)) rotate(-1.5deg); transition: opacity .9s .25s var(--ease), transform 1.1s .2s var(--ease); }
.hero h2 { margin: 0; max-width: 100%; justify-self: stretch; overflow-wrap: normal; }
.nextcard b { display: block; max-width: 100%; }
.hero .lead { margin: 0; max-width: 30ch; text-wrap: pretty; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(164px, 1fr)); gap: 10px; width: 100%; margin-top: 10px; }
.tiles button { display: flex; align-items: center; gap: 12px; min-height: 62px; padding: 12px 16px; border: 0; border-radius: var(--tile-r, 16px); background: var(--tile-bg); color: var(--tile-ink); box-shadow: var(--tile-sh); cursor: pointer; text-align: left; font-weight: 600; font-size: 15px; transition: transform .35s var(--ease), background .25s, box-shadow .3s; }
.tiles button svg { width: 24px; height: 24px; color: var(--tile-icon); }
@media (hover: hover) { .tiles button:hover { transform: translateY(-3px); box-shadow: var(--tile-sh-h); } }
.tiles button:active { transform: scale(.97); }
.scrollhint { display: inline-flex; align-items: center; gap: 10px; margin-top: 8px; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--s-muted); }
.scrollhint i { width: 1px; height: 30px; background: currentColor; transform-origin: top; animation: hint 2s var(--ease) infinite; }
@keyframes hint { 0% { transform: scaleY(0); } 50% { transform: scaleY(1); transform-origin: top; } 51% { transform-origin: bottom; } 100% { transform: scaleY(0); transform-origin: bottom; } }

.story { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 56px; }
.ch { min-height: 86vh; display: flex; align-items: center; padding-block: 8vh; }
.chin { display: grid; gap: 16px; max-width: 470px; transition: opacity .6s var(--ease); }
.ch:not(.now) .chin { opacity: .3; }
.kicker { display: inline-flex; align-items: center; gap: 8px; justify-self: start; }
.kicker svg { width: 18px; height: 18px; }
.ch h3 { margin: 0; text-wrap: balance; }
.ch p { margin: 0; text-wrap: pretty; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips span { padding: 7px 12px; border-radius: 999px; background: var(--s-card); font-size: 14px; }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.sq { display: grid; gap: 3px; align-content: start; padding: 13px 14px; border-radius: var(--tile-r, 14px); background: var(--s-card); min-height: 74px; }
.sq b { font-weight: 600; font-size: 15px; }
.sq span { font-size: 13.5px; line-height: 1.35; color: var(--s-muted); }
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.steps li { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: var(--tile-r, 14px); background: var(--s-card); font-weight: 500; }
.steps li span { width: 26px; height: 26px; flex: none; border-radius: 50%; display: grid; place-items: center; background: var(--s-accent); color: var(--s-accent-ink); font-size: 13px; font-weight: 700; }
.inline { display: none; }

.media { position: relative; }
.stage { position: sticky; top: 0; height: 100vh; height: 100svh; display: grid; align-items: center; }
.dev { grid-area: 1 / 1; justify-self: center; transition: opacity .7s var(--ease), transform .9s var(--ease), filter .7s var(--ease); }
.media .dev.after { opacity: 0; transform: translateY(60px) scale(.96); filter: blur(8px); }
.media .dev.before { opacity: 0; transform: translateY(-60px) scale(.96); filter: blur(8px); }
.media .dev.on { opacity: 1; transform: none; filter: none; }
/* one iPad and one iPhone, drawn the same everywhere: bezel and corners are fixed fractions of the
   device's own width (--w, measured by the script), so a small one is a true copy of a big one */
.ipad { --w: 600px; width: 100%; padding: calc(var(--w) * .026); border-radius: calc(var(--w) * .052); background: var(--bezel); box-shadow: 0 40px 80px -36px rgba(10, 14, 30, .55), 0 0 0 1px rgba(255, 255, 255, .07) inset; }
.ipad img { display: block; width: 100%; height: auto; aspect-ratio: 1400 / 973; object-fit: cover; object-position: 50% 0; border-radius: calc(var(--w) * .028); background: #eceef3; }
.phone { --w: 240px; width: min(300px, 46%); padding: calc(var(--w) * .042); border-radius: calc(var(--w) * .18); background: var(--bezel); box-shadow: 0 40px 80px -36px rgba(10, 14, 30, .55), 0 0 0 1px rgba(255, 255, 255, .07) inset; }
.phone img { display: block; width: 100%; height: auto; aspect-ratio: 600 / 1300; object-fit: contain; object-position: 50% 0; border-radius: calc(var(--w) * .14); background: #fff; }
.media .phone { width: calc(min(76vh, 640px) / 2.08); }

.nextf { display: grid; gap: 18px; padding-block: 12vh 70px; }
.nextcard { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); align-items: stretch; gap: 0; padding: 0; border: 0; border-radius: 26px; overflow: hidden; background: var(--next-bg); color: var(--next-ink); cursor: pointer; text-align: left; transition: transform .5s var(--ease), box-shadow .5s var(--ease); box-shadow: var(--tile-sh); }
@media (hover: hover) { .nextcard:hover { transform: translateY(-4px); box-shadow: var(--tile-sh-h); } .nextcard:hover .np img { transform: scale(1.05); } }
.nextcard .nt { display: grid; align-content: center; gap: 8px; padding: 34px 36px; }
.nextcard small { font-size: 13px; opacity: .7; }
.nextcard em { font-style: normal; opacity: .75; max-width: 34ch; }
.nextcard .np { position: relative; overflow: hidden; min-height: 240px; }
.nextcard .np img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 30% 20%; transition: transform 1s var(--ease); }
.others { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.others button { display: inline-flex; align-items: center; gap: 8px; padding: 9px 14px; border-radius: 999px; border: 0; cursor: pointer; background: var(--s-card); color: inherit; font-weight: 500; transition: background .2s; }
.others button svg { width: 18px; height: 18px; }
.others button[aria-current] { background: var(--s-accent); color: var(--s-accent-ink); }

/* ---------- motion ---------- */
.rv { opacity: 0; transform: translateY(26px); transition: opacity .7s var(--ease), transform .9s var(--ease); }
.sheet.in .rv.in { opacity: 1; transform: none; }
.rv.grid > *, .rv.chips > *, .rv.steps > *, .rv.tiles > * { opacity: 0; transform: translateY(14px) scale(.98); transition: opacity .5s var(--ease), transform .7s var(--ease), background .25s, box-shadow .3s; }
.sheet.in .rv.in.grid > *, .sheet.in .rv.in.chips > *, .sheet.in .rv.in.steps > *, .sheet.in .rv.in.tiles > * { opacity: 1; transform: none; }
.rv > *:nth-child(2) { transition-delay: .05s; } .rv > *:nth-child(3) { transition-delay: .1s; } .rv > *:nth-child(4) { transition-delay: .15s; }
.rv > *:nth-child(5) { transition-delay: .2s; } .rv > *:nth-child(6) { transition-delay: .25s; } .rv > *:nth-child(7) { transition-delay: .3s; } .rv > *:nth-child(8) { transition-delay: .35s; }
.hero .rv:nth-child(2) { transition-delay: .06s; } .hero .rv:nth-child(3) { transition-delay: .12s; } .hero .rv:nth-child(4) { transition-delay: .18s; } .hero .rv:nth-child(5) { transition-delay: .5s; }
@media (hover: hover) { .sheet.in .tiles.in > *:hover { transform: translateY(-3px); transition-delay: 0s; } }
.sheet .sbody { transition: opacity .3s var(--ease), transform .4s var(--ease); }
.sheet.leaving .sbody { opacity: 0; transform: translateY(-24px); }

@media (max-width: 900px) {
  .story { grid-template-columns: 1fr; gap: 0; }
  .media { display: none; }
  .ch { min-height: 0; padding-block: 44px; }
  .ch:not(.now) .chin { opacity: 1; }
  .chin { max-width: 640px; }
  .inline { display: block; margin-top: 8px; }
  .inline .phone { width: min(240px, 62%); margin: 0 auto; }
  .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .hero { min-height: 0; padding-block: 24px 20px; grid-template-columns: 1fr; }
  .hdev { display: none; }
  .nextcard { grid-template-columns: 1fr; }
  .nextcard .np { min-height: 180px; }
  .nextcard .nt { padding: 24px 22px; }
}
@media (max-width: 760px), (max-height: 560px) and (orientation: landscape) and (max-width: 1000px) {
  .drawer { height: auto; display: grid; grid-template-columns: minmax(0, 1fr); margin-top: 14px; }
  .folder { position: relative; inset: auto; height: auto; min-height: 112px; margin-top: -16px; transform: none; }
  .folder::before, .folder .tab, .folder .peek { display: none; }
  .folder .strip { position: relative; width: auto; flex-direction: column; justify-content: flex-start; gap: 8px; padding: 20px 20px 30px; }
  .folder.shift, .folder.lift { transform: none; }
  .folder.pull { transform: translateY(-6px); }
  .cover { order: -1; margin: 0 0 4px; }
}
@media (prefers-reduced-motion: reduce) {
  .folder, .rv, .rv > *, .dev, .chin, .sbody { transition: none !important; }
  .scrollhint i { animation: none; }
}

@supports not (color: color-mix(in srgb, red, blue)) {
  html .sheet { --s-muted: var(--c-ink); --s-rule: rgba(128, 128, 128, .32); --s-card: rgba(128, 128, 128, .16); --tile-bg: rgba(128, 128, 128, .14);
    --tile-sh: inset 0 0 0 1px rgba(128, 128, 128, .3); --tile-sh-h: inset 0 0 0 1px rgba(128, 128, 128, .5), 0 16px 30px -18px rgba(0, 0, 0, .5); --bar-bg: var(--c-bg); --icon-bg-h: rgba(128, 128, 128, .2); }
}

:root {
  --ground: #7c7666; --ink: #1f1e1b; --ink-soft: #4a473f; --line: rgba(31, 30, 27, .16); --accent: #23397a; --on-ground: #f3efe6;
  --display: "Archivo", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --body: "Hanken Grotesk", -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --ease: cubic-bezier(.2, .8, .2, 1);
  --bezel: #1b1a17;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --ground: #262420; --on-ground: #eee9de; color-scheme: dark; } }
:root[data-theme="dark"] { --ground: #262420; --on-ground: #eee9de; color-scheme: dark; }
body { background: var(--ground); color: var(--on-ground); font: 400 16px/1.55 var(--body); }
.mono { font-family: var(--mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
:focus-visible { outline: 2px solid currentColor; outline-offset: 3px; }
.top { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding-block: 18px 6px; }
.top .mono { opacity: .8; }
.top b { font: 800 18px/1 var(--display); font-stretch: 80%; letter-spacing: .02em; text-transform: uppercase; }

.folder { border-radius: 14px 18px 18px 14px; color: var(--c-ink); background: var(--c-bg) var(--grain); background-blend-mode: multiply; box-shadow: -10px 0 24px -12px rgba(0, 0, 0, .55), inset 1px 0 0 rgba(255, 255, 255, .25); }
.folder::before { content: ""; position: absolute; left: -30px; top: var(--tab-y, 40px); width: 34px; height: 170px; background: inherit; background-blend-mode: multiply; border-radius: 12px 0 0 12px; box-shadow: -6px 0 12px -8px rgba(0, 0, 0, .45); }
.folder .tab { position: absolute; left: -26px; top: var(--tab-y, 40px); height: 170px; width: 26px; display: flex; align-items: center; justify-content: center; writing-mode: vertical-rl; z-index: 2; font: 500 11.5px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; opacity: .85; white-space: nowrap; }
.folder .name { writing-mode: vertical-rl; padding-left: 22px; font: 800 40px/1 var(--display); font-stretch: 68%; letter-spacing: .005em; text-transform: uppercase; white-space: nowrap; }
.folder .sb { display: grid; gap: 14px; }
.folder .contents li { font: 500 11.5px/1.25 var(--mono); letter-spacing: .06em; text-transform: uppercase; opacity: .86; }
.folder .contents li::before { content: "— "; opacity: .5; }
.folder .bars { margin-left: 20px; width: 26px; height: 22px; background: repeating-linear-gradient(90deg, currentColor 0 2px, transparent 2px 4px, currentColor 4px 5px, transparent 5px 8px); opacity: .5; }
.folder .num { padding-left: 20px; font: 500 11px/1 var(--mono); letter-spacing: .1em; opacity: .75; }
.folder .peek { border-radius: 6px; background: rgba(0, 0, 0, .08); }
.folder .peek img { filter: grayscale(.6) sepia(.2) contrast(.95); mix-blend-mode: multiply; }
.folder:focus-visible .peek img, .folder.lift .peek img { filter: none; mix-blend-mode: normal; }

.cover { color: var(--ink); background: #b9b2a2 var(--grain); background-blend-mode: multiply; }
.cover { overflow: hidden; }
.cover .inner { position: absolute; inset: 0; display: grid; grid-template-rows: auto auto minmax(0, 1fr); padding: 30px 30px 0 132px; gap: 18px; }
.cover .big { position: absolute; left: 14px; top: 22px; bottom: 26px; writing-mode: vertical-rl; font: 900 112px/.86 var(--display); font-stretch: 62%; letter-spacing: .01em; text-transform: uppercase; white-space: nowrap; display: flex; align-items: flex-start; }
.cover h1 { margin: 0; font: 700 clamp(30px, 3vw, 44px)/1.02 var(--display); font-stretch: 76%; text-wrap: balance; max-width: 15ch; }
.cover p { margin: 0; max-width: 34ch; color: var(--ink-soft); }
.cover .meta { display: grid; gap: 4px; font: 500 11px/1.4 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); }
.cover .meta span { display: flex; justify-content: space-between; gap: 12px; border-top: 1px solid var(--line); padding-top: 6px; }
.cta { display: inline-flex; align-items: center; gap: 10px; justify-self: start; padding: 12px 20px; border-radius: 999px; background: var(--accent); color: #fff; font: 600 15px/1 var(--body); white-space: nowrap; }
.cover .hint { font: 500 12px/1.4 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); display: flex; align-items: center; gap: 8px; }
.hint-phone { display: none; }
.cover .spine-note { position: absolute; left: 112px; bottom: 26px; writing-mode: vertical-rl; font: 500 10.5px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-soft); white-space: nowrap; }
.cover .inner { grid-template-columns: minmax(0, 1fr); }
.drawer.tight .cover .big { font-size: 88px; }
.drawer.tight .cover .inner { padding-left: 108px; padding-right: 24px; }
.drawer.tight .cover .spine-note { left: 88px; }
a.cta { text-decoration: none; transition: filter .2s, transform .2s; }
a.cta:hover { filter: brightness(1.18); }
a.cta:active { transform: scale(.97); }
.drawer.tight .folder .contents { display: none; }
.drawer.tight .folder .name { font-size: 34px; }
.cover .hint i { width: 28px; height: 1px; background: currentColor; display: inline-block; }

.also { display: flex; flex-wrap: wrap; gap: 10px 26px; padding-block: 6px 26px; }
.also span { display: inline-flex; align-items: center; gap: 8px; font: 500 12px/1.3 var(--mono); letter-spacing: .07em; text-transform: uppercase; }
.also svg { width: 16px; height: 16px; }
.foot { display: grid; grid-template-columns: 1.3fr 1fr; gap: 28px 48px; padding-block: 26px 48px; border-top: 1px solid rgba(243, 239, 230, .18); }
.foot p { margin: 0; max-width: 62ch; opacity: .92; font-size: 15px; }
.foot nav { display: flex; gap: 18px; flex-wrap: wrap; justify-content: flex-end; align-items: start; }
.foot nav a { text-decoration: none; border-bottom: 1px solid rgba(243, 239, 230, .4); padding-bottom: 2px; }

/* open folder */
.sheet { background: var(--c-bg) var(--grain); background-blend-mode: multiply; color: var(--c-ink); font-family: var(--body);
  --s-bg: var(--c-bg); --s-ink: var(--c-ink); --s-muted: color-mix(in srgb, var(--c-ink) 80%, transparent); --s-rule: color-mix(in srgb, var(--c-ink) 18%, transparent);
  --s-card: color-mix(in srgb, var(--c-ink) 8%, transparent); --s-accent: var(--c-ink); --s-accent-ink: var(--c-bg);
  --tile-bg: color-mix(in srgb, var(--c-ink) 7%, transparent); --tile-ink: var(--c-ink); --tile-icon: var(--c-ink); --tile-r: 10px;

      tuner: ['Afinador', 'Um afinador que aprende a tua afinação.', 'A agulha mostra os cents e a nota fica verde quando estás afinado. Com o tempo, aprende que notas costumas tocar altas ou baixas.', [['Lá de referência', 'Por exemplo 442 Hz'], ['Temperada', 'Como o piano'], ['Justa', 'Terceiras e quintas puras'], ['Pitagórica', 'Quintas puras'], ['Tendência', 'Alto ou baixo ultimamente'], ['Afinador pequeno', 'Por cima da partitura']]],
      harmonics: ['Harmónicos', 'Que harmónico, em que corda, onde tocar.', 'Toca um harmónico natural e o Stand diz-te qual é. Ouve a série de qualquer corda e vê quanto cada harmónico se afasta do piano: o 5.º harmónico fica 14 cents abaixo, o 7.º 31 cents abaixo.'],
      drone: ['Bordão', 'Um bordão que segue a música.', 'Uma nota fixa em intervalos puros, para que cada batimento que ouves seja a tua própria afinação. Som de órgão, suave, arco ou trompa, com a quinta ou a oitava se quiseres. Quando a música muda de tonalidade, o bordão pode acompanhar.', [['Eu toco', 'Fica até o mudares'], ['Ele ouve', 'Muda quando a tonalidade muda mesmo'], ['A minha lista', 'As tuas notas, pela tua ordem'], ['Todas as tonalidades', 'Avança a cada 2 a 16 compassos']]],
      record: ['Gravar', 'Grava enquanto lês.', 'Áudio para o melhor som, ou vídeo para veres a postura. Um compasso de contagem do metrónomo, e a partitura fica no ecrã.', ['Áudio ou vídeo', 'Frontal, traseira ou iPhone', 'Um compasso de contagem', 'Manter o clique']],
      camera: ['Câmara do iPhone', 'O teu iPhone como segunda câmara.', 'Abre o Stand no iPhone e escolhe câmara para o iPad. Os dois encontram-se sozinhos. Ajusta o brilho, a cor e o zoom a partir do iPad, e o vídeo chega quando paras.'],
      recordings: ['Gravações', 'Ouve mais devagar, na mesma altura.', 'Arrasta sobre a onda para repetir uma passagem e ouvi-la a 50–100% da velocidade, na mesma altura. Acrescenta o som de uma sala ou de uma igreja e corta o que não precisas. O Studio põe a partitura no teu vídeo, a acompanhar o que tocas, em quadrado ou vertical e pronto a partilhar.', ['Repetir de A a B', 'Velocidade 50–100%', 'Som de sala ou igreja', 'Cortar', 'Studio: partitura no vídeo', 'Luz e cor automáticas']],
      video: ['Vídeo sobre a partitura', 'Vê-te ao lado da música.', 'Arrasta um vídeo das Gravações para cima da partitura. Faz zoom até 5× no braço do arco, abranda-o, e as páginas continuam a virar por baixo.'],
      along: ['Ouvir', 'Grandes gravações, à distância de um toque.', 'Guarda com cada partitura as interpretações de que gostas, no YouTube, Spotify ou Apple Music. Ou toca com um ficheiro de áudio, mais devagar e em repetição entre A e B.'],
      composer: ['Compositor', 'Escreve com o Pencil, ouve-o tocado.', 'As notas ficam onde tocas na pauta. Duas vozes por pauta, ligaduras e reguladores entre compassos, casas de repetição, e Tocar com instrumentos de orquestra gravados.', ['Da semibreve à fusa', 'Voz 1 / Voz 2', 'Quiálteras de 2 a 11', 'Transpor por intervalo ou tonalidade', 'Abre MusicXML']],
      instruments: ['Instrumentos', 'Mais de 100 instrumentos, cada um no seu tom.', 'Madeiras, metais, percussão, teclas, guitarras, vozes e cordas, com todos os instrumentos transpositores e a banda de metais. Escreve em sons reais; as partes saem no tom que cada músico lê.', ['Clarinete em Lá, Si♭, Mi♭', 'Trompa em Fá ou Mi♭', 'Bombardino, saxtrompa', 'Do solo à orquestra']],
      layout: ['Grafia e som', 'Gravado como deve ser.', 'Tamanho da pauta, papel e orientação, pautas vazias escondidas e pautas que nunca se atropelam. Escolhe a sala e a afinação, de Lá = 415 a 443.'],
      export: ['Exportar', 'Partitura, partes, MusicXML e MIDI.', 'Tudo o que uma banda ou uma orquestra precisa, a partir de uma só partitura.', [['Partitura', 'PDF, cada um no seu tom'], ['Todas as partes', 'Transpostas, pausas de vários compassos'], ['Sons reais', 'Para o maestro'], ['MusicXML', 'Sibelius, Dorico, MuseScore'], ['Áudio e MIDI', 'Ficheiros WAV e MIDI'], ['Na minha estante', 'Lê-a e anota-a']]],
      capture: ['Ler música', 'Da página impressa às notas.', 'Escolhe linhas num PDF, numa digitalização ou numa fotografia. O Stand lê as notas, ritmos, pausas, acidentes, clave, armação e compasso, e cola-os em qualquer instrumento e compasso.', ['Compositor ▸ Capturar', 'Toca ou desliza sobre as linhas', 'Cola na partitura']],
      notebooks: ['Cadernos', 'Papel de música com capa.', 'Papel pautado, de linhas ou liso para exercícios, ditados, notas de aula ou um diário de estudo. Acrescenta fotografias em formas ou dentro de uma palavra, cartões de vidro, fita washi e autocolantes, e move o que quiseres entre páginas.'],
    },
    also: ['iPad e iPhone juntos', 'Cópia de segurança no iCloud Drive ou no Ficheiros', 'Azul ou preto, claro ou escuro', 'Só as tuas ferramentas no ecrã inicial', 'Auscultadores e pedais Bluetooth', 'Funciona sem internet'],
    high: [['Vira a página sem largar o arco.', 'Pisca o olho, carrega num pedal, bate na estante ou deixa o Stand seguir o que tocas. A meia página mostra o que vem a seguir, para nunca seres apanhado no fim da página.'],
      ['Estuda os compassos difíceis, não a obra toda outra vez.', 'Rodeia os compassos que precisam de trabalho, dá-lhes um tempo objetivo e regista o que conseguiste cada dia. Uma sessão de estudo leva-te de uma passagem à seguinte, em todas as tuas partituras.'],
      ['Ouve onde estás. Vê como tocas.', 'Um afinador que aprende que notas tocas altas ou baixas. Filma-te enquanto lês, vê-te ao lado da música, mais devagar, e põe a partitura no vídeo para partilhar.'],
      ['Da página impressa à tua própria partitura.', 'Escolhe linhas numa digitalização ou num PDF e o Stand lê as notas para o compositor. Arranja-as para mais de 100 instrumentos e imprime as partes, cada uma no seu tom.']],
    tools: ['Leitor de partituras', 'Anotações com o Pencil', 'Plano de estudo', 'Metrónomo', 'Afinador', 'Bordão', 'Gravador e vídeo', 'Registo de estudo', 'Notação', 'Cadernos'],
    faq: [['Em que dispositivos funciona o Stand?', 'iPad e iPhone com iPadOS ou iOS 15 ou posterior. O iPad é a estante; o iPhone guarda o teu estudo, as partituras para ler e as ferramentas no bolso, e pode filmar para o iPad. Virar páginas a piscar o olho usa a câmara frontal e funciona melhor num iPad com Face ID.'],
      ['Preciso de conta ou de internet?', 'Nunca há conta. O Stand funciona sem internet. A internet só é usada quando pedes algo online, como procurar uma partitura no IMSLP ou abrir uma gravação no YouTube, Spotify ou Apple Music.'],
      ['Onde ficam as minhas partituras?', 'No teu dispositivo, no Stand e numa pasta Stand na app Ficheiros (Partituras, Gravações, Cópias). Faz uma cópia de segurança de tudo num só ficheiro quando quiseres, por exemplo no iCloud Drive, e recupera-a num iPad novo.'],
      ['Posso usar o meu pedal de virar páginas?', 'Sim. Os pedais Bluetooth funcionam logo. Também podes piscar o olho, tocar na margem da página, bater na estante, deixar o metrónomo virar a cada poucos compassos ou deixar o Stand seguir o que tocas.'],
      ['As anotações alteram o PDF?', 'Nunca. As anotações ficam numa camada própria. Esconde-as com um toque, ou exporta a partitura com elas ou como cópia limpa.'],
      ['Serve para o meu instrumento?', 'O Stand é feito para todos os músicos que leem música: cordas, sopros, metais, teclas, guitarra, voz. O afinador, o bordão, os harmónicos e as escalas sentem-se especialmente em casa com instrumentos de corda, e o compositor conhece mais de 100 instrumentos.']],
  },

  /* ---------------- Español ---------------- */
  es: {
    f: { read: ['Leer', 'Tus partituras en el atril, dos páginas a la vez, pasadas sin levantar la mano.'],
      mark: ['Anotar', 'Escribe en la música con el Apple Pencil, como lo harías con un lápiz en el papel.'],
      practise: ['Estudiar', 'Saber qué estudiar, a qué velocidad y cuánto has estudiado de verdad.'],

    c: {
      library: ['Biblioteca', 'Todas tus partituras en un solo lugar.', 'Importa PDF y fotos, o escanea páginas con la cámara. Como una app de escaneo, Stand encuentra la página, la endereza por las líneas del pentagrama y quita las sombras, para que una foto parezca una copia limpia. El título y el compositor se leen solos.', ['Importar desde Archivos', 'Escanear con la cámara', 'Carpetas', 'Una carpeta Stand en la app Archivos']],
      find: ['Buscar partitura', 'Partituras de dominio público en segundos.', 'Busca en la biblioteca IMSLP por compositor y obra. Stand marca la mejor edición para tu instrumento y llega a tu biblioteca, lista para leer y anotar. Para las ediciones que vale la pena tener, enlaza con Henle, Bärenreiter y otras editoriales.', ['Escribe “Bach suite violonchelo”', 'Elige tu instrumento', 'Toca un resultado']],
      turns: ['Pasar páginas', 'Seis formas de pasar la página.', 'Dos páginas una al lado de otra en horizontal, una en vertical, o una página horizontal girada en una pantalla vertical. Pásalas como mejor te venga en cada momento.', [['Tocar o deslizar', 'En los bordes de la página'], ['Pedal', 'Cualquier pedal Bluetooth'], ['Guiñar el ojo', 'El derecho avanza, el izquierdo retrocede'], ['Escucha', 'Sigue lo que tocas, y tus ojos (beta)'], ['Golpe', 'Un toque firme en el atril'], ['Metrónomo', 'Cada 2 a 16 compases']]],
      thisscore: ['Esta partitura', 'Cada partitura preparada a tu manera.', 'Con la media página ves el principio de la página siguiente mientras terminas esta, así nunca esperas a un cambio de página.', [['Media página', 'Mira lo que viene'], ['Repeticiones y saltos', 'D.C., repeticiones, codas'], ['Marcadores', 'Salta a un movimiento'], ['Papel', 'Blanco, cálido o noche'], ['Música más grande', 'Sin márgenes blancos'], ['Exportar PDF', 'Con o sin anotaciones']]],
      pages: ['Páginas', 'Corrige la edición, no solo la leas.', 'Recorta una página a la música que necesitas, córtala entre sistemas o sube líneas para que el cambio de página caiga en un mejor sitio. Añade páginas desde un archivo, endereza una página y quita páginas: no se pierde nada hasta que tú lo decides.', ['Recortar', 'Cortar entre sistemas', 'Subir líneas', 'Añadir páginas', 'Girar una página', 'Restaurar todo']],
      sets: ['Sets', 'Un concierto entero en un solo orden de lectura.', 'Elige páginas de distintas partituras para una audición, un examen o un concierto. Tras la última página de una obra, la siguiente partitura se abre en la página correcta. Sin crear un PDF nuevo.', ['Nuevo set, ponle nombre', 'Añade música: toca la primera y la última página', 'Tocar: el pedal te lleva hasta el final']],
      perform: ['Actuar', 'En el escenario, solo la música.', 'El modo Actuar oculta todas las herramientas, así un toque sin querer nunca abre nada. Los cambios de página, el pedal y el guiño siguen funcionando.'],
      pencil: ['Apple Pencil', 'El primer toque nunca escribe.', 'Toca la partitura con el Pencil y se abren las herramientas, nada más. El siguiente trazo escribe. El dedo sigue pasando páginas y haciendo zoom, y la mano puede apoyarse en el cristal, así nunca escribes sin querer.', [['Bolígrafo', 'Tipos, grosores, colores'], ['Rotulador', 'Color transparente'], ['Texto', 'Escríbelo o dibújalo con el Pencil'], ['Goma', 'Solo tus anotaciones'], ['Goma de partitura', 'Quita una ligadura impresa, respeta el pentagrama'], ['Dos colores', 'Negro y rojo, a un toque'], ['Nota', 'Una hoja transparente encima'], ['Pulso firme', 'Líneas más tranquilas y rectas']]],
      symbols: ['Símbolos', 'Símbolos con un toque.', 'Elige un símbolo y toca la música donde va.', ['pp a ff, sfz, fp', 'Arco abajo, arco arriba', 'Digitaciones 0–4', 'Cuerdas I–IV', 'Calderón, respiración, acento', 'rit., a tempo, pizz., arco', 'Gafas (¡atención!)']],
      slurs: ['Ligaduras', 'Dibuja una ligadura, recibe una grabada.', 'Dibuja de la primera nota a la última. Stand traza una ligadura limpia y afilada, arriba o abajo, del lado en que la dibujaste.'],
      select: ['Seleccionar', 'Rodéalo: muévelo, cópialo o conviértelo en un pasaje.', 'Dibuja un lazo alrededor de lo que escribiste para moverlo, cambiar su tamaño, copiarlo o borrarlo. Rodea compases y la primera opción es crear un pasaje.'],
      clean: ['Copia limpia', 'Tus anotaciones nunca tocan la edición.', 'Las anotaciones se guardan aparte de la página impresa. Ocúltalas todas con el ojo, o exporta la partitura con ellas para un alumno, o como copia limpia.', ['Ocultar las anotaciones', 'Exportar con anotaciones', 'Exportar una copia limpia']],
      passages: ['Pasajes', 'Un registro de tempo para cada sitio difícil.', 'Rodea los compases y dale al pasaje un tipo, un tempo inicial y un objetivo. Anota cada día el tempo que conseguiste: la barra se llena hacia el objetivo y un pequeño gráfico muestra tu mejor marca, día a día.', [['Melódico', 'Primero limpio, luego rápido'], ['Técnico', '+5 bpm cuando sale limpio'], ['Cambio de posición', 'Despacio y a tempo'], ['Ritmo', 'Primero solo el ritmo'], ['Arco y respiración', 'El patrón por separado'], ['Lo que se quedó atrás', 'Pasajes olvidados hace tiempo']]],
      session: ['Sesión de estudio', 'Todos tus pasajes, a un cambio de página.', 'Dale una prioridad a cada pasaje. Stand empieza por los más importantes y por los más lejos de su objetivo. Pasar la página te lleva al siguiente pasaje, en cualquier partitura, con la página entera a la vista.', ['Alta · Media · Baja · Saltar', 'Prioridad alta dos veces', 'En todas tus partituras']],
      reps: ['Repeticiones', 'Cuenta las veces seguidas sin fallos.', 'Marca cada vez limpia y cada fallo: un fallo vuelve a empezar la cuenta. Ponte un objetivo de 3, 5, 7 o 10.'],
      metronome: ['Metrónomo', 'Un metrónomo que hace más que clic.', 'Marca el tempo con el dedo, acentúa o silencia cualquier pulso y deja que pase tus páginas. Sigue sonando mientras afinas, grabas o cambias de app.', [['Compás', 'De 1/4 a 12/8'], ['Subdivisión', 'Corcheas, tresillos, semicorcheas'], ['Entrenador de velocidad', 'Gradual o por escalones'], ['Compases en silencio', 'Mantén tú el tempo'], ['Destello', 'Ve el primer pulso'], ['Sonido', 'Clic, caja china, pitido']]],
      scales: ['Escalas', 'Escalas en notas largas, o rápidas.', 'Cualquier tonalidad, mayor, menores y modos, con su propio tempo. Cada nota dura 4, 3, 2 o 1 pulsos, o va de 2 a 4 por pulso, con un clic limpio y un bordón debajo.', ['Cada nota: 4 pulsos', 'Bordón en la tónica', 'Temperada, justa o pitagórica', 'Sonido de piano, órgano o arco', 'Un compás de entrada']],
      log: ['Registro de estudio', 'Mira lo que has estudiado de verdad.', 'El tiempo cuenta solo mientras hay una partitura abierta o una herramienta en marcha. El anillo de la pantalla de inicio se llena hacia tu objetivo diario.', [['Objetivo diario', 'De 15 minutos a 4 horas'], ['Racha', 'Días seguidos'], ['Gráfico', 'Semana, mes, año'], ['Por obra', 'Minutos en cada una'], ['Hoy', 'Una nota sobre lo siguiente'], ['Temporizador', '25/5, 45/15, 60/20']]],

      iphone: ['iPhone', 'Tu estudio en el bolsillo.', 'El iPhone muestra el día, la semana y cada obra de tu iPad, y guarda las partituras del iPad para leerlas donde estés. Lejos del atril tiene el afinador, los armónicos, el bordón, el metrónomo, las escalas, las repeticiones, un temporizador y grabación, y funciona como cámara del iPad.', ['Las partituras del iPad, para leer', 'Tiempo de estudio por iCloud', 'Cámara para el iPad']],
      tuner: ['Afinador', 'Un afinador que aprende tu afinación.', 'La aguja muestra los cents y la nota se pone verde cuando estás afinado. Con el tiempo aprende qué notas sueles tocar altas o bajas.', [['La de referencia', 'Por ejemplo 442 Hz'], ['Temperada', 'Como el piano'], ['Justa', 'Terceras y quintas puras'], ['Pitagórica', 'Quintas puras'], ['Tendencia', 'Alto o bajo últimamente'], ['Afinador pequeño', 'Sobre la partitura']]],
      harmonics: ['Armónicos', 'Qué armónico, en qué cuerda, dónde tocar.', 'Toca un armónico natural y Stand te dice cuál es. Escucha la serie de cualquier cuerda y mira cuánto se aleja cada armónico del piano: el 5.º armónico está 14 cents bajo, el 7.º 31 cents bajo.'],
      drone: ['Bordón', 'Un bordón que sigue la música.', 'Una nota fija en intervalos puros, para que cada batido que oigas sea tu propia afinación. Sonido de órgano, suave, arco o trompa, con la quinta o la octava si quieres. Cuando la música cambia de tonalidad, el bordón puede seguirla.', [['Yo toco', 'Se queda hasta que lo cambies'], ['Escucha', 'Cambia cuando la tonalidad cambia de verdad'], ['Mi lista', 'Tus notas, en tu orden'], ['Todas las tonalidades', 'Avanza cada 2 a 16 compases']]],
      record: ['Grabar', 'Graba mientras lees.', 'Audio para el mejor sonido, o vídeo para ver tu postura. Un compás de entrada del metrónomo, y la partitura sigue en pantalla.', ['Audio o vídeo', 'Frontal, trasera o iPhone', 'Un compás de entrada', 'Mantener el clic']],
      camera: ['Cámara del iPhone', 'Tu iPhone como segunda cámara.', 'Abre Stand en el iPhone y elige cámara para el iPad. Los dos se encuentran solos. Ajusta el brillo, el color y el zoom desde el iPad, y el vídeo llega cuando paras.'],
      recordings: ['Grabaciones', 'Escucha más despacio, a la misma altura.', 'Arrastra sobre la onda para repetir un pasaje y escucharlo al 50–100 % de velocidad, a la misma altura. Añade el sonido de una sala o una iglesia y corta lo que no necesites. Studio pone la partitura en tu vídeo, siguiendo lo que tocas, en cuadrado o vertical y listo para compartir.', ['Repetir de A a B', 'Velocidad 50–100 %', 'Sonido de sala o iglesia', 'Cortar', 'Studio: partitura en el vídeo', 'Luz y color automáticos']],
      video: ['Vídeo sobre la partitura', 'Mírate junto a la música.', 'Arrastra un vídeo de Grabaciones sobre la partitura. Haz zoom hasta 5× en el brazo del arco, ralentízalo, y las páginas siguen pasando debajo.'],
      along: ['Escuchar', 'Grandes grabaciones, a un toque.', 'Guarda con cada partitura las interpretaciones que te gustan, en YouTube, Spotify o Apple Music. O toca con un archivo de audio, más despacio y en bucle entre A y B.'],
      composer: ['Compositor', 'Escribe con el Pencil, escúchalo tocado.', 'Las notas caen donde tocas el pentagrama. Dos voces por pentagrama, ligaduras y reguladores entre compases, casillas de repetición, y Tocar con instrumentos de orquesta grabados.', ['De la redonda a la fusa', 'Voz 1 / Voz 2', 'Grupos irregulares de 2 a 11', 'Transportar por intervalo o tonalidad', 'Abre MusicXML']],
      instruments: ['Instrumentos', 'Más de 100 instrumentos, cada uno en su tono.', 'Maderas, metales, percusión, teclados, guitarras, voces y cuerdas, con todos los instrumentos transpositores y la banda de metales. Escribe en sonidos reales; las partes salen en el tono que lee cada músico.', ['Clarinete en La, Si♭, Mi♭', 'Trompa en Fa o Mi♭', 'Bombardino, trompa tenor', 'Del solo a la orquesta']],
      layout: ['Grabado y sonido', 'Grabado como debe ser.', 'Tamaño del pentagrama, papel y orientación, pentagramas vacíos ocultos y pentagramas que nunca chocan. Elige la sala y la afinación, de La = 415 a 443.'],
      export: ['Exportar', 'Partitura, partes, MusicXML y MIDI.', 'Todo lo que necesita una banda o una orquesta, a partir de una sola partitura.', [['Partitura', 'PDF, cada uno en su tono'], ['Todas las partes', 'Transportadas, silencios de varios compases'], ['Sonidos reales', 'Para el director'], ['MusicXML', 'Sibelius, Dorico, MuseScore'], ['Audio y MIDI', 'Archivos WAV y MIDI'], ['En mi atril', 'Léela y anótala']]],
      capture: ['Leer música', 'De la página impresa a las notas.', 'Elige líneas en un PDF, un escaneo o una foto. Stand lee las notas, ritmos, silencios, alteraciones, clave, armadura y compás, y los pega en cualquier instrumento y compás.', ['Compositor ▸ Capturar', 'Toca o desliza sobre las líneas', 'Pega en la partitura']],
      notebooks: ['Cuadernos', 'Papel pautado con tapa.', 'Papel pautado, de rayas o liso para ejercicios, dictados, notas de clase o un diario de estudio. Añade fotos en formas o dentro de una palabra, tarjetas de cristal, cinta washi y pegatinas, y mueve lo que quieras entre páginas.'],

    high: [['Pasa la página sin soltar el arco.', 'Guiña el ojo, pisa un pedal, golpea el atril o deja que Stand siga lo que tocas. La media página muestra lo que viene, para que nunca te pille el final de la página.'],
