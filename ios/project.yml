name: Stand
options:
  bundleIdPrefix: com.paulo
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
targets:
  Stand:
    type: application
    platform: iOS
    sources:
      - path: Stand
        excludes:
          - "www/**"
      - path: Stand/www
        type: folder
        buildPhase: resources
    info:
      path: Stand/Info.plist
      properties:
        CFBundleDisplayName: Stand
        CFBundleName: Stand
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: ""
        UIRequiresFullScreen: false
        UIStatusBarStyle: UIStatusBarStyleDefault
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSMicrophoneUsageDescription: Stand listens to your instrument for the tuner, harmonics and recordings. Nothing leaves your iPad.
        NSCameraUsageDescription: Stand films your practice when you choose to record video. Videos stay on your iPad.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: false
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.paulo.stand
        PRODUCT_NAME: Stand
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        ENABLE_BITCODE: NO
