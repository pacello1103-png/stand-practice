name: Tutti screenshots

on:
  push:
    branches: [tutti]
  workflow_dispatch:

jobs:
  shots:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build for simulator
        shell: bash
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild -project Tutti.xcodeproj -target Tutti -configuration Debug -sdk iphonesimulator \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO build > build.log 2>&1 || { grep -E "error:" build.log | sort -u | head -n 150; exit 1; }
          tail -n 3 build.log

      - name: Run on iPhone and iPad simulators
        shell: bash
        run: |
          set -x
          APP=build/Debug-iphonesimulator/Tutti.app
          IPHONE_TYPE=$(xcrun simctl list devicetypes -j | jq -r '.devicetypes[] | select(.name=="iPhone 16 Pro") | .identifier' | head -1)
          IPAD_TYPE=$(xcrun simctl list devicetypes -j | jq -r '.devicetypes[] | select(.name|startswith("iPad Pro 13")) | .identifier' | tail -1)
          IPH=$(xcrun simctl create shots-iphone "$IPHONE_TYPE")
          IPD=$(xcrun simctl create shots-ipad "$IPAD_TYPE")
          for D in $IPH $IPD; do
            xcrun simctl boot $D
            xcrun simctl bootstatus $D -b
            xcrun simctl ui $D appearance dark || true
            xcrun simctl status_bar $D override --time 9:41 --batteryState charged --batteryLevel 100 --wifiBars 3 || true
            xcrun simctl install $D "$APP"
            xcrun simctl privacy $D grant microphone com.paulo.tutti || true
            xcrun simctl privacy $D grant camera com.paulo.tutti || true
            xcrun simctl privacy $D grant photos-add com.paulo.tutti || true
          done
          mkdir -p shots
          shot() { xcrun simctl io $1 screenshot "shots/$2.png"; }
          # iPad in landscape for the director and editor
          xcrun simctl launch $IPD com.paulo.tutti; sleep 8; shot $IPD ipad-home
          xcrun simctl terminate $IPD com.paulo.tutti
          xcrun simctl launch $IPD com.paulo.tutti -demo director; sleep 8; shot $IPD ipad-director
          xcrun simctl terminate $IPD com.paulo.tutti
          xcrun simctl launch $IPD com.paulo.tutti -demo editor; sleep 75; shot $IPD ipad-editor
          xcrun simctl terminate $IPD com.paulo.tutti
          xcrun simctl launch $IPD com.paulo.tutti -demo sound; sleep 15; shot $IPD ipad-sound
          xcrun simctl terminate $IPD com.paulo.tutti
          xcrun simctl launch $IPD com.paulo.tutti -demo picture; sleep 15; shot $IPD ipad-picture
          xcrun simctl terminate $IPD com.paulo.tutti
          xcrun simctl launch $IPD com.paulo.tutti -demo export; sleep 100; shot $IPD ipad-export
          xcrun simctl terminate $IPD com.paulo.tutti
          # iPhone
          xcrun simctl launch $IPH com.paulo.tutti; sleep 8; shot $IPH iphone-home
          xcrun simctl terminate $IPH com.paulo.tutti
          xcrun simctl launch $IPH com.paulo.tutti -demo editor; sleep 75; shot $IPH iphone-editor
          xcrun simctl terminate $IPH com.paulo.tutti
          xcrun simctl launch $IPH com.paulo.tutti -demo director; sleep 8; shot $IPH iphone-director
          # what the demo project looks like after preparing (sync + look results)
          DATA=$(xcrun simctl get_app_container $IPD com.paulo.tutti data)
          find "$DATA/Documents/Projects" -name project.json -exec cp {} shots/project.json \; || true
          xcrun simctl spawn $IPD log show --last 10m --predicate 'process == "Tutti"' --style compact 2>/dev/null | grep -iE "error|fault|exception" | tail -n 80 > shots/log.txt || true
          ls -la shots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: shots
