name: Tutti screenshots

on:
  push:
    branches: [tutti]
  workflow_dispatch:

jobs:
  shots:
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Build for simulator
        shell: bash
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild -project Tutti.xcodeproj -target Tutti -configuration Debug -sdk iphonesimulator \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO build > build.log 2>&1 || { grep -E "error:" build.log | sort -u | head -n 200; exit 1; }
          tail -n 3 build.log

      - name: Screenshots on iPad and iPhone, upright and sideways
        shell: bash
        run: |
          set -x
          xcodebuild -version
          APP=build/Debug-iphonesimulator/Tutti.app
          mkdir -p shots
          run_device() {
            local NAME=$1 TYPE=$2
            D=$(xcrun simctl create "shots-$NAME" "$TYPE")
            xcrun simctl boot $D
            xcrun simctl bootstatus $D -b
            xcrun simctl ui $D appearance dark || true
            xcrun simctl install $D "$APP"
            for s in microphone camera photos-add; do xcrun simctl privacy $D grant $s com.paulo.tutti || true; done
            shot() { xcrun simctl io $D screenshot "shots/$NAME-$1.png"; }
            run() { xcrun simctl terminate $D com.paulo.tutti 2>/dev/null || true; sleep 1; xcrun simctl launch $D com.paulo.tutti "$@"; }
            run -demo director; sleep 15; shot director
            run -demo director -landscape; sleep 15; shot director-landscape
            run -demo editor; sleep 45; shot editor
            run -demo editor -landscape; sleep 20; shot editor-landscape
            run -demo sound; sleep 15; shot sound
            run -demo picture -landscape; sleep 15; shot picture-landscape
            run; sleep 8; shot home
            if [ "$NAME" = "iphone" ]; then
              run -demo camera; sleep 12; shot camera
              run -demo camera -landscape; sleep 12; shot camera-landscape
            fi
            if [ "$NAME" = "ipad" ]; then
              run -demo export -landscape; sleep 150; shot export
              DATA=$(xcrun simctl get_app_container $D com.paulo.tutti data)
              find "$DATA/Documents/Projects" -name project.json -exec cp {} shots/project.json \; || true
              cp "$DATA/tmp/"*.mov shots/export.mov 2>/dev/null || true
              ls -laR "$DATA/Documents" > shots/files.txt 2>&1 || true
              cp "$DATA/Documents/demo-error.txt" shots/ 2>/dev/null || true
            fi
            xcrun simctl shutdown $D || true
          }
          IPAD_TYPE=$(xcrun simctl list devicetypes -j | jq -r '.devicetypes[] | select(.name|startswith("iPad Pro 13")) | .identifier' | tail -1)
          IPHONE_TYPE=$(xcrun simctl list devicetypes -j | jq -r '.devicetypes[] | select(.name=="iPhone 16 Pro") | .identifier' | head -1)
          run_device ipad "$IPAD_TYPE"
          run_device iphone "$IPHONE_TYPE"
          ls -la shots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: shots
