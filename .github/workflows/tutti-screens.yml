name: Tutti screenshots

on:
  push:
    branches: [tutti]
  workflow_dispatch:

jobs:
  shots:
    runs-on: macos-15
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: Build for simulator
        shell: bash
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild -project Tutti.xcodeproj -target Tutti -configuration Debug -sdk iphonesimulator \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO build > build.log 2>&1 || { grep -E "error:" build.log | sort -u | head -n 150; exit 1; }
          tail -n 3 build.log

      - name: Run on the iPad simulator
        shell: bash
        run: |
          set -x
          APP=build/Debug-iphonesimulator/Tutti.app
          IPAD_TYPE=$(xcrun simctl list devicetypes -j | jq -r '.devicetypes[] | select(.name|startswith("iPad Pro 13")) | .identifier' | tail -1)
          D=$(xcrun simctl create shots-ipad "$IPAD_TYPE")
          xcrun simctl boot $D
          xcrun simctl bootstatus $D -b
          xcrun simctl ui $D appearance dark || true
          xcrun simctl install $D "$APP"
          for s in microphone camera photos-add; do xcrun simctl privacy $D grant $s com.paulo.tutti || true; done
          mkdir -p shots
          shot() { xcrun simctl io $D screenshot "shots/$1.png"; }
          run() { xcrun simctl terminate $D com.paulo.tutti 2>/dev/null || true; xcrun simctl launch $D com.paulo.tutti "$@"; }
          run -demo director; sleep 20; shot director
          run -demo editor; sleep 90; shot editor
          run -demo sound; sleep 25; shot sound
          run -demo picture; sleep 25; shot picture
          run -demo export; sleep 150; shot export
          DATA=$(xcrun simctl get_app_container $D com.paulo.tutti data)
          find "$DATA/Documents/Projects" -name project.json -exec cp {} shots/project.json \; || true
          ls -laR "$DATA/Documents" "$DATA/tmp" > shots/files.txt 2>&1 || true
          cp "$DATA/Documents/demo-error.txt" shots/ 2>/dev/null || true
          ls -la shots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: shots
